name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject AT key from secret
        env:
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
        run: |
          mkdir _site
          cp index.html index2.html _site/
          if [ -n "$AT_API_KEY" ]; then
            perl -pi -e 's/__AT_API_KEY__/$ENV{AT_API_KEY}/g' _site/index.html _site/index2.html
          else
            echo "::warning::AT_API_KEY secret not set; built-in key button will be hidden."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
