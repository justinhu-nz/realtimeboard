<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auckland Live Departures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #142038;
      --surface: #1b2940;
      --surface2: #2b384b;
      --surface3: #36465f;
      --border: #4c5f79;
      --text: #eef8ff;
      --muted: #b9c8d8;
      --accent: #62ddf4;
      --accent-strong: #3ed2f1;
      --accent-text: #163047;
      --good: #62ddf4;
      --warn: #f1c666;
      --bad: #ee4ca4;
      --radius: 8px;
      font-family: "Open Sans", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100vh; }
    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    button {
      font: inherit;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: .5rem .8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, border-color .15s, background .15s;
    }
    button:hover { opacity: .88; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
    button.ghost { background: var(--surface2); color: var(--text); border-color: var(--border); }
    button.danger { background: transparent; color: #ffc8e4; border-color: var(--bad); }
    button.small { padding: .32rem .58rem; font-size: .82rem; }
    input, textarea, select {
      font: inherit;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      padding: .42rem .55rem;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { min-height: 3.1rem; resize: vertical; }

    /* Setup */
    .setup {
      max-width: 1180px;
      margin: 0 auto;
      padding: .75rem;
      font-size: .9rem;
    }
    .setup-header {
      margin-bottom: .45rem;
    }
    .setup-header h1 {
      font-size: 1.25rem;
      line-height: 1.15;
      margin-bottom: .15rem;
    }
    .setup-header p { color: var(--muted); font-size: .86rem; }
    .quick-actions {
      display: flex;
      gap: .4rem;
      margin: .45rem 0;
      flex-wrap: wrap;
    }
    .status-bar {
      padding: .42rem .55rem;
      color: var(--muted);
      font-size: .84rem;
      min-height: 1.9rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
    }
    .status-bar.error { color: #ffd0e9; border-color: var(--bad); background: rgba(238, 76, 164, .12); }
    .setup-layout {
      display: block;
    }
    .debug-grid {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      margin: .45rem 0;
    }
    .debug-item {
      display: inline-flex;
      gap: .35rem;
      padding: .28rem .45rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--muted);
      font-size: .78rem;
    }
    .debug-item strong { color: var(--text); font-weight: 800; text-align: right; }
    .note {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--muted);
      font-size: .8rem;
      padding: .4rem .5rem;
    }
    .link-row {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .link-button {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .32rem .58rem;
      color: var(--text);
      font-size: .82rem;
      font-weight: 600;
      text-decoration: none;
      background: var(--surface2);
    }
    .link-button:hover { border-color: var(--accent); color: var(--text); }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: .45rem;
      overflow: hidden;
    }
    .section-header {
      padding: .36rem .5rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .section-header:hover { background: var(--surface2); }
    .section-header .arrow { transition: transform .2s; font-size: .8rem; color: var(--muted); }
    .section-header .arrow.open { transform: rotate(90deg); }
    .section-status { font-size: .75rem; font-weight: 400; color: var(--muted); margin-left: .45rem; }
    .section-body {
      padding: 0 .5rem .45rem;
      display: grid;
      gap: .42rem;
    }
    .section-body.hidden { display: none; }
    .field label {
      display: block;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: .25rem;
      font-weight: 400;
    }
    .hint {
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.35;
      margin-top: .22rem;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; }
    .stop-results {
      max-height: 10rem;
      overflow-y: auto;
      display: grid;
      gap: .4rem;
    }
    .stop-item {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .38rem .48rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: .85rem;
    }
    .stop-item .name { flex: 1; font-weight: 600; }
    .stop-item .id { color: var(--muted); font-size: .78rem; }
    .step {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .55rem .65rem;
      margin-bottom: .45rem;
      display: grid;
      gap: .45rem;
    }
    .step h2 { font-size: .98rem; font-weight: 700; }
    .step-status { font-size: .75rem; font-weight: 400; color: var(--muted); margin-left: .4rem; }
    .ok { color: var(--good); }
    .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: .15rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .2rem .25rem .2rem .6rem;
      font-size: .82rem;
      font-weight: 600;
    }
    .chip .chip-id { color: var(--muted); font-weight: 400; font-size: .74rem; margin-left: .3rem; }
    .chip button { padding: 0 .45rem; background: transparent; border: none; color: var(--muted); font-size: .95rem; line-height: 1.3; }
    .chip button:hover { color: #ffd0e9; opacity: 1; }
    .cta-row { display: flex; align-items: center; gap: .6rem; margin: .55rem 0; }
    .cta-row .primary { font-size: 1.02rem; padding: .62rem 1.2rem; }

    /* Connect strip (timetable + API key) */
    .connect { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin: .5rem 0; }
    .connect-pill {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      padding: .5rem .6rem;
      display: grid;
      gap: .4rem;
      align-content: start;
    }
    .connect-pill.done { background: rgba(98, 221, 244, .08); border-color: rgba(98, 221, 244, .4); }
    .connect-pill.bad { background: rgba(238, 76, 164, .1); border-color: var(--bad); }
    .pill-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .pill-title { font-weight: 700; font-size: .86rem; }
    .pill-title .req {
      font-weight: 600; font-size: .64rem; text-transform: uppercase; letter-spacing: .04em;
      color: #ffd0e9; border: 1px solid rgba(238, 76, 164, .5); border-radius: 999px;
      padding: .02rem .34rem; margin-left: .35rem; vertical-align: middle;
    }
    .pill-state { font-size: .76rem; color: var(--muted); white-space: nowrap; }
    .pill-state.ok { color: var(--good); font-weight: 700; }
    .pill-state.bad { color: #ffd0e9; font-weight: 700; }
    .pill-sub { font-size: .75rem; color: var(--muted); }
    .pill-sub a { color: var(--accent); }
    .pill-actions { display: flex; gap: .4rem; align-items: center; }
    .pill-actions input[name=subscriptionKey] { flex: 1; }
    .pill-actions .link-button, .pill-actions button { flex: none; }
    input.key-bad { border-color: var(--bad); }
    .mode-explainer {
      display: flex;
      align-items: flex-start;
      gap: .55rem;
      margin: -.05rem 0 .55rem;
      padding: .55rem .65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.35;
    }
    .mode-explainer strong { color: var(--text); white-space: nowrap; }
    .mode-dot {
      width: .62rem;
      height: .62rem;
      margin-top: .22rem;
      border-radius: 999px;
      background: var(--muted);
      flex: none;
    }
    .mode-dot.full { background: var(--good); }
    .mode-dot.limited { background: var(--warn); }
    .mode-dot.degraded, .mode-dot.scheduled { background: var(--bad); }
    button.linkish {
      background: none; border: none; padding: 0; color: var(--accent);
      font-size: inherit; font-weight: 600; text-decoration: underline; cursor: pointer;
    }
    button.linkish:hover { opacity: .85; }

    /* Focused step + stop result meta + inline preview */
    .step.focus { border-color: rgba(98, 221, 244, .45); box-shadow: inset 0 0 0 1px rgba(98, 221, 244, .12); }
    .stop-item .name { flex: 1; font-weight: 600; display: flex; flex-direction: column; }
    .stop-item .name .meta { font-weight: 400; color: var(--muted); font-size: .72rem; }
    .preview { border: 1px dashed var(--border); border-radius: var(--radius); padding: .45rem .55rem; display: grid; gap: .35rem; background: var(--surface); }
    .preview-title { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .preview-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .55rem; font-size: .92rem; }
    .preview-row .pv-pill {
      display: inline-flex; justify-content: center; align-items: center;
      min-width: 2.7rem; height: 1.55rem; padding: 0 .42rem; border-radius: 6px;
      background: linear-gradient(180deg, #73e8fa 0%, #57d9f2 100%);
      color: var(--accent-text); font-weight: 700; font-size: .85rem;
    }
    .preview-row .pv-due { font-weight: 700; white-space: nowrap; }
    .preview-empty { font-size: .78rem; color: var(--muted); }
    @media (max-width: 700px) { .connect { grid-template-columns: 1fr; } }

    /* Board */
    .board {
      min-height: 100vh;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .board.frameless {
      padding: 0;
    }
    .chrome-toggle {
      position: absolute;
      top: .2rem;
      right: .25rem;
      z-index: 20;
      min-width: 1.6rem;
      min-height: 1.6rem;
      padding: 0;
      border-radius: 999px;
      background: rgba(43, 56, 75, .9);
      border-color: rgba(185, 200, 216, .28);
      color: #d9ecf7;
      font-size: .72rem;
      line-height: 1;
    }
    .chrome-toggle:hover {
      background: rgba(54, 70, 95, .95);
      border-color: rgba(98, 221, 244, .45);
    }
    .board.frameless .chrome-toggle {
      top: .18rem;
      right: .18rem;
      opacity: .1;
      background: transparent;
      border-color: transparent;
      color: #f0fbff;
    }
    .board.frameless .chrome-toggle:hover {
      opacity: .45;
      background: rgba(43, 56, 75, .55);
      border-color: rgba(185, 200, 216, .18);
    }
    .board-shell {
      flex: 1;
      background: var(--surface2);
      border: 1px solid #41516a;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: .6rem;
      padding: .7rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .board-shell.frameless {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      padding: 0;
      gap: 0;
    }
    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: .2rem .2rem .1rem;
    }
    .board-header h1 {
      font-size: clamp(1.6rem, 3.5vw, 3rem);
      line-height: 1.1;
      font-weight: 700;
    }
    .board-header .sub { color: var(--muted); font-size: .9rem; }
    .board-meta {
      text-align: right;
      font-size: .9rem;
      color: #d9ecf7;
      display: flex;
      flex-direction: column;
      gap: .3rem;
      align-items: flex-end;
      width: 100%;
    }
    .board-meta-top {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .7rem;
      width: 100%;
    }
    .board-controls {
      display: flex;
      gap: .3rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .board-shell.frameless .board-header {
      display: none;
    }
    .board-shell.frameless .board-controls {
      display: none;
    }
    .board-shell.frameless .board-meta-top {
      display: none;
    }
    .board-shell.frameless .alert-banner {
      display: none;
    }
    .board-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .alert-banner {
      padding: .6rem .8rem;
      border-radius: var(--radius);
      font-size: .9rem;
      border: 1px solid;
    }
    .alert-banner.warn { background: rgba(241, 198, 102, .12); border-color: rgba(241, 198, 102, .4); color: #ffe2a2; }
    .alert-banner.bad { background: rgba(238, 76, 164, .14); border-color: rgba(238, 76, 164, .4); color: #ffd0e9; }
    .dep-table {
      width: 100%;
      flex: 1;
      min-height: 0;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .board.frameless .dep-table,
    .board.frameless .empty-state {
      border-radius: 0;
    }
    .dep-head,
    .dep-row {
      display: grid;
      grid-template-columns: 8.75rem minmax(0, 1fr) 8.75rem 6rem;
      align-items: center;
    }
    .dep-head {
      padding: .32rem .9rem .28rem;
      font-size: clamp(.88rem, .95vw, .98rem);
      font-weight: 700;
      color: #f0fbff;
      background: rgba(255,255,255,.03);
    }
    .dep-head > div:last-child,
    .dep-row > div:last-child {
      text-align: right;
    }
    .dep-head > div:nth-child(3),
    .dep-row > div:nth-child(3) {
      text-align: center;
    }
    .dep-rows {
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(var(--row-count, 1), minmax(0, 1fr));
    }
    .dep-row {
      padding: .5rem .9rem;
      border-top: 1px solid rgba(185, 200, 216, .18);
      min-height: 0;
    }
    .dep-row > div,
    .dep-head > div {
      min-width: 0;
    }
    .route-pill {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 6.65rem;
      height: 2.85rem;
      padding: 0 .45rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.95rem;
      line-height: 1;
      letter-spacing: 0;
      background: linear-gradient(180deg, #73e8fa 0%, #57d9f2 100%);
      color: var(--accent-text);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.18);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .route-pill.outline {
      background: transparent;
      color: var(--text);
      border: 2px solid rgba(222, 236, 248, .75);
      box-shadow: none;
    }
    .dest-cell strong {
      display: block;
      font-size: 1.95rem;
      font-weight: 700;
      line-height: 1;
    }
    .dest-cell {
      min-height: 100%;
      display: flex;
      align-items: center;
    }
    .badge {
      display: inline-block;
      padding: .28rem .72rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: .84rem;
    }
    .badge.cancelled { color: #fff3fb; background: var(--bad); border: 1px solid transparent; font-size: 1.05rem; font-weight: 700; padding: .3rem .85rem; }
    .occ-cell {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: .22rem;
      color: rgba(222, 236, 248, .9);
    }
    .occ-cell svg { display: block; fill: currentColor; width: 0.62rem; height: 1.8rem; }
    .occ-cell .dim { color: rgba(185, 200, 216, .38); }
    .due-cell {
      text-align: right;
      font-size: clamp(1.9rem, 2.8vw, 3rem);
      font-weight: 700;
      color: #f0fbff;
      white-space: nowrap;
      line-height: 1;
    }
    .empty-state {
      flex: 1;
      display: grid;
      place-content: center;
      text-align: center;
      min-height: 12rem;
      color: var(--muted);
      background: var(--surface);
      border-radius: var(--radius);
    }
    .board-footer {
      display: flex;
      align-items: center;
      gap: .75rem;
      background: rgba(98, 221, 244, .08);
      border-radius: var(--radius);
      padding: .75rem .9rem;
      overflow: hidden;
      border: 1px solid rgba(98, 221, 244, .18);
    }
    .board-shell.frameless .board-footer {
      border-left-color: transparent;
      border-right-color: transparent;
      border-bottom-color: transparent;
      border-radius: 0;
      padding-left: .5rem;
      padding-right: .5rem;
      background: transparent;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: .55rem;
      white-space: nowrap;
      color: #e9fbff;
      font-size: clamp(1rem, 1.4vw, 1.25rem);
      font-weight: 600;
    }
    .legend-swatch {
      width: 1.05em;
      height: 1.05em;
      border-radius: .28em;
      background: linear-gradient(180deg, #73e8fa 0%, #57d9f2 100%);
      flex: none;
    }
    .ticker {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      color: #ffe2a2;
      font-size: clamp(.95rem, 1.3vw, 1.15rem);
      font-weight: 600;
      text-align: center;
    }
    .mode-indicator {
      display: inline-flex;
      align-items: center;
      gap: .42rem;
      flex: none;
      max-width: 42%;
      padding: .3rem .62rem;
      border: 1px solid rgba(185, 200, 216, .28);
      border-radius: 999px;
      color: #e9fbff;
      background: rgba(185, 200, 216, .08);
      font-size: clamp(.78rem, 1.05vw, .98rem);
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mode-indicator.full { border-color: rgba(91, 214, 143, .45); background: rgba(91, 214, 143, .12); }
    .mode-indicator.limited { border-color: rgba(241, 198, 102, .5); background: rgba(241, 198, 102, .12); color: #ffe2a2; }
    .mode-indicator.degraded,
    .mode-indicator.scheduled { border-color: rgba(238, 76, 164, .45); background: rgba(238, 76, 164, .12); color: #ffd0e9; }
    .mode-indicator .mode-dot { margin-top: 0; }
    .ambient-status {
      display: none;
      width: .68rem;
      height: .68rem;
      border-radius: 999px;
      flex: none;
      opacity: .88;
    }
    .ambient-status.good { background: var(--good); box-shadow: 0 0 .72rem rgba(91, 214, 143, .72); }
    .ambient-status.warn { background: var(--warn); box-shadow: 0 0 .72rem rgba(241, 198, 102, .68); }
    .ambient-status.bad { background: var(--bad); box-shadow: 0 0 .72rem rgba(238, 76, 164, .68); }
    .board-shell.frameless .mode-indicator { display: none; }
    .board-shell.frameless .ambient-status { display: inline-block; }
    .clock {
      font-weight: 700;
      font-size: clamp(1.4rem, 2vw, 2.2rem);
      white-space: nowrap;
      padding: .15rem 0 0;
      background: transparent;
      border-radius: var(--radius);
      color: #f1fbff;
    }
    @media (max-width: 700px) {
      .setup { padding: .5rem; }
      .board { padding: .5rem; }
      .board-header { flex-direction: column; gap: .5rem; }
      .board-meta { text-align: left; align-items: flex-start; }
      .board-meta-top { justify-content: space-between; }
      .board-controls { justify-content: flex-start; }
      .row { grid-template-columns: 1fr; }
      .dep-head { display: none; }
      .dep-table, .dep-rows, .dep-row { display: block; width: 100%; }
      .dep-row { padding: .6rem 0; border-top: 1px solid rgba(185, 200, 216, .18); }
      .dep-row > div { padding: .3rem .8rem; text-align: left !important; }
      .dep-head,
      .dep-row {
        grid-template-columns: 1fr;
      }
      .route-pill { width: 5.7rem; height: 3rem; font-size: 1.7rem; }
      .dest-cell { min-height: auto; }
      .dest-cell strong { font-size: 1.7rem; }
      .due-cell { font-size: clamp(1.6rem, 9vw, 2.7rem); }
      .due-cell { text-align: left; }
      .board-footer { flex-wrap: wrap; }
      .mode-indicator { max-width: 100%; order: 3; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const STORE_KEY = "akl-pid-v2";
    // Credential embedded in AT's live-departures web page. It provides limited per-stop
    // predictions without a personal key, but does not replace the comprehensive GTFS-RT
    // feeds. Kept as a fallback if config migration removes departuresKey.
    const DEPARTURES_KEY = "0526f69dcb074a4b8df741eef46121fc";
    const LEGACY_GTFS_URL = "https://gtfs.at.govt.nz/gtfs.zip";
    const DEFAULT_GTFS_FILE = "gtfs.zip";
    const SAME_FOLDER_GTFS_CANDIDATES = [DEFAULT_GTFS_FILE, "gtfs (1).zip"];
    const DEFAULT_CONFIG = {
      timezone: "Pacific/Auckland",
      gtfsUrl: DEFAULT_GTFS_FILE,
      realtimeUrl: "https://api.at.govt.nz/realtime/legacy/tripupdates",
      alertsUrl: "https://api.at.govt.nz/realtime/legacy/servicealerts",
      vehiclesUrl: "https://api.at.govt.nz/realtime/legacy/vehiclelocations",
      departuresUrl: "https://api.at.govt.nz/serviceinfo/v1/departures",
      departuresKey: DEPARTURES_KEY,
      frequentRoutes: "",
      subscriptionKey: "",
      pollSeconds: 30,
      pageSize: 6,
      rotateSeconds: 12,
      lockFirstPage: false,
      requireSubscriptionKey: true,
      lookaheadHours: 6,
      relativeCutoffMinutes: 60,
      staleMultiplier: 2,
      routeAllowlist: "",
      stopIds: "8205-eda192d2",
      chromeHidden: false,
      mode: "setup"
    };

    const state = {
      config: loadConfig(),
      bundle: loadBundle(),
      gtfs: null,
      realtime: loadRealtime(),
      status: "",
      error: "",
      realtimeStatus: "",
      now: new Date(),
      page: 0,
      stopSearch: "",
      autoGtfsAttempted: false,
      pageLocked: false,
      refreshing: false,
      refreshFailed: false,
      keyTest: null, // null | "testing" | "ok" | "fail"
      expandedSections: { advanced: false }
    };
    let timers = [];
    let realtimeRequestSeq = 0;
    state.pageLocked = Boolean(state.config.lockFirstPage);

    function loadConfig() {
      const saved = loadJson("config") || {};
      if (saved.demoMode || String(saved.stopIds || "").includes("demo-")) return Object.assign({}, DEFAULT_CONFIG);
      delete saved.demoMode;
      if (saved.gtfsUrl === LEGACY_GTFS_URL) delete saved.gtfsUrl;
      if (!saved.realtimeUrl) delete saved.realtimeUrl;
      if (!saved.alertsUrl) delete saved.alertsUrl;
      if (!saved.vehiclesUrl) delete saved.vehiclesUrl;
      if (!saved.departuresUrl) delete saved.departuresUrl;
      if (!saved.departuresKey) delete saved.departuresKey;
      // Old default was 20; migrate to the new 60 (matches the AT website, which shows
      // "45 min" rather than switching to clock time). Explicit other values are kept.
      if (saved.relativeCutoffMinutes === 20) delete saved.relativeCutoffMinutes;
      return sanitizeConfig(Object.assign({}, DEFAULT_CONFIG, saved));
    }
    function loadBundle() {
      const bundle = loadJson("bundle");
      return bundle && bundle.source !== "demo" ? bundle : null;
    }
    function loadRealtime() {
      const realtime = loadJson("realtime");
      return realtime && realtime.sourceUrl !== "demo://local" ? realtime : null;
    }
    function loadJson(name) {
      try {
        const raw = localStorage.getItem(STORE_KEY + ":" + name);
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }
    function saveJson(name, value) {
      try { localStorage.setItem(STORE_KEY + ":" + name, JSON.stringify(value)); }
      catch { state.status = "Storage unavailable — settings will not persist."; render(); }
    }
    function clearTimers() { timers.forEach(clearInterval); timers = []; }
    function splitList(text) {
      return String(text || "").split(/[,\n]/).map(v => v.trim()).filter(Boolean);
    }
    function gtfsRtArray(value) {
      if (!value) return [];
      if (Array.isArray(value)) return value;
      if (typeof value !== "object") return [];
      const singleKeys = ["trip_update", "tripUpdate", "vehicle", "alert", "stop_sequence", "stopSequence", "stop_id", "stopId", "arrival", "departure", "route_id", "routeId"];
      return singleKeys.some(k => k in value) ? [value] : Object.values(value);
    }
    function normLabel(value) {
      return String(value || "").trim().toLowerCase();
    }
    function clampNumber(value, fallback, min, max) {
      const n = Number(value);
      if (!Number.isFinite(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    }
    function safeTimezone(value) {
      const tz = String(value || DEFAULT_CONFIG.timezone).trim();
      try {
        new Intl.DateTimeFormat("en-NZ", { timeZone: tz }).format(new Date());
        return tz;
      } catch { return DEFAULT_CONFIG.timezone; }
    }
    function sanitizeConfig(cfg) {
      cfg.timezone = safeTimezone(cfg.timezone);
      cfg.pollSeconds = clampNumber(cfg.pollSeconds, DEFAULT_CONFIG.pollSeconds, 5, 3600);
      cfg.pageSize = Math.round(clampNumber(cfg.pageSize, DEFAULT_CONFIG.pageSize, 1, 50));
      cfg.rotateSeconds = clampNumber(cfg.rotateSeconds, DEFAULT_CONFIG.rotateSeconds, 3, 3600);
      cfg.lookaheadHours = clampNumber(cfg.lookaheadHours, DEFAULT_CONFIG.lookaheadHours, 1, 48);
      cfg.relativeCutoffMinutes = clampNumber(cfg.relativeCutoffMinutes, DEFAULT_CONFIG.relativeCutoffMinutes, 0, 180);
      cfg.staleMultiplier = clampNumber(cfg.staleMultiplier, DEFAULT_CONFIG.staleMultiplier, 1, 20);
      return cfg;
    }
    function escapeHtml(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function safeHref(value) {
      try {
        const url = new URL(String(value || ""), location.href);
        return /^(https?|file):$/.test(url.protocol) ? url.href : "#";
      } catch { return "#"; }
    }
    function gtfsFetchCandidates(primary = state.config.gtfsUrl) {
      const values = [primary, ...SAME_FOLDER_GTFS_CANDIDATES]
        .map(v => String(v || "").trim())
        .filter(Boolean);
      return Array.from(new Set(values));
    }

    // CSV parser
    function csvParse(text) {
      const rows = [];
      let row = [], field = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], n = text[i + 1];
        if (quoted) {
          if (c === '"' && n === '"') { field += '"'; i++; }
          else if (c === '"') quoted = false;
          else field += c;
        } else if (c === '"') quoted = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c !== "\r") field += c;
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      const header = rows.shift() || [];
      return rows.filter(r => r.length && r.some(Boolean)).map(r => Object.fromEntries(header.map((h, i) => [h, r[i] || ""])));
    }

    // ZIP reader
    async function readZipEntries(buffer, names) {
      if (!("DecompressionStream" in globalThis)) throw new Error("Browser needs DecompressionStream (Chrome/Edge).");
      const bytes = new Uint8Array(buffer);
      const view = new DataView(buffer);
      let eocd = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--) {
        if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error("Invalid ZIP file.");
      const entryCount = view.getUint16(eocd + 10, true);
      let cdOffset = view.getUint32(eocd + 16, true);
      const wanted = new Set(names);
      const output = {};
      for (let e = 0; e < entryCount; e++) {
        if (view.getUint32(cdOffset, true) !== 0x02014b50) throw new Error("Invalid ZIP entry.");
        const method = view.getUint16(cdOffset + 10, true);
        const compressedSize = view.getUint32(cdOffset + 20, true);
        const nameLen = view.getUint16(cdOffset + 28, true);
        const extraLen = view.getUint16(cdOffset + 30, true);
        const commentLen = view.getUint16(cdOffset + 32, true);
        const localOffset = view.getUint32(cdOffset + 42, true);
        const name = new TextDecoder().decode(bytes.slice(cdOffset + 46, cdOffset + 46 + nameLen));
        if (wanted.has(name)) {
          const localNameLen = view.getUint16(localOffset + 26, true);
          const localExtraLen = view.getUint16(localOffset + 28, true);
          const start = localOffset + 30 + localNameLen + localExtraLen;
          const compressed = bytes.slice(start, start + compressedSize);
          let fileBytes;
          if (method === 0) fileBytes = compressed;
          else if (method === 8) fileBytes = new Uint8Array(await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
          else throw new Error("Unsupported ZIP method " + method);
          output[name] = new TextDecoder("utf-8").decode(fileBytes);
        }
        cdOffset += 46 + nameLen + extraLen + commentLen;
      }
      return output;
    }

    // GTFS ingestion. stop_times.txt in a full AT feed is ~80 MB / 1.7M rows; parsing it
    // all into objects froze the page for minutes. Instead, work happens in an inline
    // Web Worker, and stop_times is never fully parsed: the worker scans it line by line
    // and returns only the rows for the configured stops (a few hundred).
    function stopTimesFilterSource() {
      // Serialized into the worker. NL/CR constants avoid template-escaping mistakes.
      return `
        const NL = String.fromCharCode(10), CR = String.fromCharCode(13);
        function filterStopTimes(text, stopIds) {
          const want = new Set(stopIds);
          const headEnd = text.indexOf(NL);
          const headerLine = text.slice(0, headEnd).split(CR).join("");
          const header = headerLine.split(",");
          const stopCol = header.indexOf("stop_id");
          if (stopCol < 0) throw new Error("stop_times.txt missing stop_id column");
          const rows = [];
          let pos = headEnd + 1;
          while (pos < text.length) {
            let end = text.indexOf(NL, pos);
            if (end < 0) end = text.length;
            let line = text.slice(pos, end);
            pos = end + 1;
            if (line.endsWith(CR)) line = line.slice(0, -1);
            if (!line) continue;
            if (line.indexOf('"') >= 0) {
              const parsed = csvParse(headerLine + NL + line)[0];
              if (parsed && want.has(parsed.stop_id)) rows.push(parsed);
              continue;
            }
            const cells = line.split(",");
            if (!want.has(cells[stopCol])) continue;
            rows.push(Object.fromEntries(header.map((h, i) => [h, cells[i] || ""])));
          }
          return rows;
        }`;
    }

    function gtfsWorkerTask(message) {
      return new Promise((resolve, reject) => {
        const src = csvParse.toString() + "\n" + readZipEntries.toString() + "\n" + stopTimesFilterSource() + `
          self.onmessage = async e => {
            try {
              const { kind, buffer, names, stopIds } = e.data;
              const files = await readZipEntries(buffer, kind === "tables" ? names : ["stop_times.txt"]);
              let out;
              if (kind === "tables") {
                out = {};
                for (const k of Object.keys(files)) out[k] = csvParse(files[k]);
              } else {
                if (!files["stop_times.txt"]) throw new Error("GTFS zip missing stop_times.txt");
                out = filterStopTimes(files["stop_times.txt"], stopIds);
              }
              self.postMessage({ ok: true, out });
            } catch (err) { self.postMessage({ ok: false, error: String(err && err.message || err) }); }
          };`;
        const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        const w = new Worker(url);
        const done = fn => v => { URL.revokeObjectURL(url); w.terminate(); fn(v); };
        w.onmessage = e => (e.data.ok ? done(resolve)(e.data.out) : done(reject)(new Error(e.data.error)));
        w.onerror = e => done(reject)(new Error((e && e.message) || "Worker failed"));
        w.postMessage(message, [message.buffer]);
      });
    }

    async function ingestGtfs(buffer, source) {
      const tables = ["stops.txt", "routes.txt", "trips.txt", "calendar.txt", "calendar_dates.txt", "feed_info.txt"];
      setStatus("Reading timetable data...");
      let parsed;
      try {
        parsed = await gtfsWorkerTask({ kind: "tables", buffer: buffer.slice(0), names: tables });
      } catch (err) {
        console.warn("[gtfs] worker parse failed, parsing on main thread:", err && err.message || err);
        const files = await readZipEntries(buffer, tables);
        parsed = {};
        for (const name of Object.keys(files)) parsed[name] = csvParse(files[name]);
      }
      for (const name of ["stops.txt", "routes.txt", "trips.txt"]) {
        if (!parsed[name]) throw new Error("GTFS zip missing " + name);
      }
      state.gtfs = {
        source,
        buffer, // kept so buildBundle can filter stop_times on demand
        feedInfo: parsed["feed_info.txt"] || [],
        stops: parsed["stops.txt"],
        routes: parsed["routes.txt"],
        trips: parsed["trips.txt"],
        calendars: parsed["calendar.txt"] || [],
        calendarDates: parsed["calendar_dates.txt"] || []
      };
      setStatus("Loaded " + state.gtfs.stops.length.toLocaleString() + " stops from GTFS.");
    }

    async function selectedStopTimesFor(stopIds) {
      try {
        return await gtfsWorkerTask({ kind: "stopTimes", buffer: state.gtfs.buffer.slice(0), stopIds: Array.from(stopIds) });
      } catch (err) {
        console.warn("[gtfs] worker stop_times filter failed, falling back to main thread:", err && err.message || err);
        const files = await readZipEntries(state.gtfs.buffer, ["stop_times.txt"]);
        if (!files["stop_times.txt"]) throw new Error("GTFS zip missing stop_times.txt");
        return csvParse(files["stop_times.txt"]).filter(st => stopIds.has(st.stop_id));
      }
    }

    async function fetchGtfs(options = {}) {
      const candidates = options.candidates || gtfsFetchCandidates();
      const errors = [];
      try {
        if (!options.quiet) setStatus("Fetching GTFS zip...");
        for (const candidate of candidates) {
          try {
            const res = await fetch(candidate);
            if (!res.ok) throw new Error("Fetch failed: " + res.status);
            await ingestGtfs(await res.arrayBuffer(), candidate);
            if (candidate !== state.config.gtfsUrl) saveConfig({ gtfsUrl: candidate });
            return true;
          } catch (err) {
            errors.push(candidate + " (" + (err && err.message || err) + ")");
          }
        }
        throw new Error(errors.join("; "));
      } catch (err) {
        if (!options.quiet) setStatus(friendlyError(err, "GTFS fetch"), true);
        return false;
      }
    }

    async function uploadGtfs(file) {
      if (!file) return;
      try {
        setStatus("Reading GTFS zip...");
        await ingestGtfs(await file.arrayBuffer(), file.name);
      } catch (err) { setStatus(friendlyError(err, "GTFS upload"), true); }
    }

    function cleanColor(v) {
      const color = String(v || "").replace(/^#/, "").trim().toUpperCase();
      return /^[0-9A-F]{6}$/.test(color) ? color : "";
    }

    async function buildBundle() {
      if (!state.gtfs) { setStatus("Load GTFS data first.", true); return; }
      // AT rotates the hash suffix of stop ids ("3955-edf582eb") with GTFS releases.
      // If a configured id no longer exists, re-resolve it by its stop code prefix.
      const gtfsStopIds = new Set(state.gtfs.stops.map(s => s.stop_id));
      const resolveStop = id => {
        if (gtfsStopIds.has(id)) return id;
        const code = id.split("-")[0];
        const match = state.gtfs.stops.find(s => s.stop_code === code || s.stop_id.split("-")[0] === code);
        return match ? match.stop_id : id;
      };
      const resolved = splitList(state.config.stopIds).map(resolveStop);
      const resolvedText = resolved.join(", ");
      if (resolvedText !== splitList(state.config.stopIds).join(", ")) saveConfig({ stopIds: resolvedText });
      const stopIds = new Set(resolved);
      if (!stopIds.size) { setStatus("Add at least one stop.", true); return; }
      setStatus("Building board...");
      let candidateStopTimes;
      try { candidateStopTimes = await selectedStopTimesFor(stopIds); }
      catch (err) { setStatus(friendlyError(err, "Board build"), true); return; }
      const routeAllow = new Set(splitList(state.config.routeAllowlist).map(normLabel));
      const routesById = new Map(state.gtfs.routes.map(r => [r.route_id, r]));
      const tripsById = new Map(state.gtfs.trips.map(t => [t.trip_id, t]));
      const stopsById = new Map(state.gtfs.stops.map(s => [s.stop_id, s]));
      const calendarsByService = new Map(state.gtfs.calendars.map(c => [c.service_id, c]));
      const selectedStopTimes = [];
      const tripIds = new Set(), routeIds = new Set(), serviceIds = new Set();
      for (const st of candidateStopTimes) {
        if (!stopIds.has(st.stop_id)) continue;
        const trip = tripsById.get(st.trip_id);
        const route = trip && routesById.get(trip.route_id);
        if (!trip || !route) continue;
        const labels = [route.route_short_name, route.route_long_name, route.route_id].filter(Boolean);
        if (routeAllow.size && !labels.some(label => routeAllow.has(normLabel(label)))) continue;
        selectedStopTimes.push(st);
        tripIds.add(st.trip_id); routeIds.add(trip.route_id); serviceIds.add(trip.service_id);
      }
      if (!selectedStopTimes.length) {
        setStatus("No departures matched these stop IDs and route filters. Check the stop IDs, route labels, or leave the route filter blank.", true);
        return;
      }
      const bundle = {
        schemaVersion: 1,
        generatedAt: new Date().toISOString(),
        source: state.gtfs.source,
        config: Object.assign({}, state.config, { mode: "board" }),
        feedInfo: state.gtfs.feedInfo[0] || {},
        stops: {}, routes: {}, trips: {},
        calendars: {}, calendarDates: {}, stopTimesByStop: {}
      };
      for (const stopId of stopIds) {
        const s = stopsById.get(stopId);
        if (s) bundle.stops[stopId] = { stopId, name: s.stop_name || stopId, lat: +s.stop_lat, lon: +s.stop_lon };
      }
      for (const routeId of routeIds) {
        const r = routesById.get(routeId);
        bundle.routes[routeId] = { routeId, shortName: r.route_short_name || r.route_long_name || routeId, longName: r.route_long_name || "", color: cleanColor(r.route_color), textColor: cleanColor(r.route_text_color) };
      }
      for (const tripId of tripIds) {
        const t = tripsById.get(tripId);
        bundle.trips[tripId] = { tripId, routeId: t.route_id, serviceId: t.service_id, headsign: t.trip_headsign || t.trip_short_name || tripId, directionId: t.direction_id || "" };
      }
      for (const serviceId of serviceIds) {
        const c = calendarsByService.get(serviceId);
        if (c) bundle.calendars[serviceId] = c;
        bundle.calendarDates[serviceId] = state.gtfs.calendarDates.filter(d => d.service_id === serviceId);
      }
      for (const st of selectedStopTimes) {
        const trip = tripsById.get(st.trip_id);
        (bundle.stopTimesByStop[st.stop_id] ||= []).push({
          tripId: st.trip_id, routeId: trip.route_id, serviceId: trip.service_id,
          stopId: st.stop_id, stopSequence: +st.stop_sequence || 0,
          arrivalTime: st.arrival_time, departureTime: st.departure_time,
          headsign: st.stop_headsign || trip.trip_headsign || ""
        });
      }
      for (const stopId of Object.keys(bundle.stopTimesByStop)) {
        bundle.stopTimesByStop[stopId].sort((a, b) => a.departureTime.localeCompare(b.departureTime) || a.stopSequence - b.stopSequence);
      }
      state.bundle = bundle;
      saveJson("bundle", bundle);
      saveConfig({ mode: "board" });
      setStatus("Built board: " + selectedStopTimes.length.toLocaleString() + " departures.");
    }

    // Realtime
    function departureStopCodes() {
      // AT stop codes (the number on the sign, used by the departures API) are the
      // leading segment of GTFS stop ids like "3955-edf582eb".
      return Array.from(new Set(splitList(state.config.stopIds).map(id => id.split("-")[0]).filter(Boolean)));
    }

    // Per-stop predictions from AT's departures API. Coverage is intentionally treated as
    // partial: unmonitored and omitted trips remain scheduled on the board.
    async function fetchMovements(codes, key) {
      const base = String(state.config.departuresUrl || "").replace(/\/+$/, "");
      const movements = {};
      const results = await Promise.all(codes.map(async code => {
        try {
          const res = await fetch(base + "/" + encodeURIComponent(code) + "?scope=tripsData", {
            headers: { "Ocp-Apim-Subscription-Key": key, "Cache-Control": "no-cache" }
          });
          const payload = await res.json();
          if (!res.ok || payload.message) throw new Error((payload.message || "fetch failed") + " (" + res.status + ")");
          const feed = payload.response || payload;
          for (const m of gtfsRtArray(feed.movements)) {
            if (!m || !m.trip_id) continue;
            // The AT website prefers the arrival prediction for its "Due" display — match it.
            const expected = Date.parse(m.expectedArrivalTime || m.expectedDepartureTime || "");
            movements[m.trip_id + ":" + code] = {
              expected: Number.isFinite(expected) ? expected : undefined,
              cancelled: /cancel/i.test(String(m.arrivalStatus || "")) || /cancel/i.test(String(m.departureStatus || "")),
              monitored: Boolean(m.monitored)
            };
          }
          return { code, ok: true };
        } catch (err) {
          return { code, ok: false, error: code + " (" + (err && err.message || err) + ")" };
        }
      }));
      const errors = results.filter(r => !r.ok).map(r => r.error);
      const succeeded = results.length - errors.length;
      if (!succeeded) throw new Error("Departures API: " + errors.join("; "));
      return { movements, requested: codes.length, succeeded, errors };
    }

    async function refreshRealtime() {
      const requestId = ++realtimeRequestSeq;
      const cfg = state.config;
      const key = String(cfg.subscriptionKey || "").trim();
      const depKey = String(cfg.departuresKey || "").trim() || DEPARTURES_KEY || key;
      // Did the feeds that authenticate with the USER's subscription key work? null = not
      // tested this run. Drives the setup "Test" verdict, so it validates their key
      // specifically (the departures API uses a different embedded key and always works).
      state.subKeyOk = null;
      state.refreshing = true;
      const userFeeds = key ? [
        { kind: "tripUpdates", label: "trip updates", url: cfg.realtimeUrl },
        { kind: "alerts", label: "service alerts", url: cfg.alertsUrl },
        { kind: "vehicles", label: "vehicle positions", url: cfg.vehiclesUrl }
      ].filter(feed => feed.url) : [];
      const depCodes = cfg.departuresUrl && depKey ? departureStopCodes() : [];
      if (!userFeeds.length && !depCodes.length) {
        state.realtimeStatus = "No API key";
        state.status = "Configure the departures API or an AT subscription key to fetch live data.";
        state.error = state.status;
        state.refreshing = false;
        state.refreshFailed = true;
        return;
      }
      try {
        const headers = { "Cache-Control": "no-cache", "Ocp-Apim-Subscription-Key": key };
        const tasks = [
          {
            kind: "departures",
            label: "stop predictions",
            run: depCodes.length
              ? fetchMovements(depCodes, depKey)
              : Promise.resolve({ movements: {}, requested: 0, succeeded: 0, errors: [] })
          },
          ...userFeeds.map(feed => ({
            kind: feed.kind,
            label: feed.label,
            run: (async () => {
              const res = await fetch(feed.url, { method: "GET", headers });
              let payload;
              try { payload = await res.json(); }
              catch { throw new Error("Realtime response from " + feed.url + " is not JSON."); }
              if (!res.ok || payload.message) {
                throw new Error((payload.message || "Realtime fetch failed") + " (" + res.status + ")");
              }
              return normalizeRealtime(payload, feed.url);
            })()
          }))
        ];
        const settled = await Promise.allSettled(tasks.map(task => task.run));
        if (requestId !== realtimeRequestSeq) return;
        const failures = settled

    }

    // Status
    function setStatus(msg, isError) {
      state.status = msg || "";
      state.error = isError ? msg : "";
      render();
    }

    // Config helpers
    function saveConfig(patch = {}) {
      Object.assign(state.config, patch);
      sanitizeConfig(state.config);
      saveJson("config", state.config);
    }
    function resetAll() {
      try { Object.keys(localStorage).filter(k => k.startsWith(STORE_KEY)).forEach(k => localStorage.removeItem(k)); } catch {}
      realtimeRequestSeq++;
      state.config = Object.assign({}, DEFAULT_CONFIG);
      state.bundle = null; state.gtfs = null; state.realtime = null;
      state.status = ""; state.error = ""; state.refreshing = false; state.refreshFailed = false;
      state.autoGtfsAttempted = false;
      render();
    }

    // Rendering
    function stopDisplayName(stopId) {
      if (state.gtfs) {
        const s = state.gtfs.stops.find(s => s.stop_id === stopId);
        if (s && s.stop_name) return s.stop_name;
      }
      const b = state.bundle && state.bundle.stops && state.bundle.stops[stopId];
      return (b && b.name) || stopId;
    }

    // Tiny live sample of the current board, shown inline under the stop picker so users
    // see it working before committing to fullscreen. Reflects the last-built bundle.
    function renderPreview() {
      if (!state.bundle) return "";
      let rows = [];
      try { rows = deriveDepartures().slice(0, 2); } catch { rows = []; }
      const body = rows.length
        ? rows.map(r => `<div class="preview-row"><span class="pv-pill">${escapeHtml(r.routeLabel)}</span><span class="pv-dest">${escapeHtml(normalizeDestinationLabel(r.destination))}</span><span class="pv-due">${r.status === "cancelled" ? "Cancelled" : r.status === "scheduled" ? timeLabel(r.scheduled, state.config.timezone) : formatDue(r.effective, state.now.getTime(), state.config)}</span></div>`).join("")
        : `<div class="preview-empty">No upcoming departures for the current board.</div>`;
      return `<div class="preview"><div class="preview-title">Current board preview</div>${body}</div>`;
    }

    function renderSetup() {
      const cfg = state.config;
      const results = state.gtfs && state.stopSearch.trim()
        ? state.gtfs.stops.filter(s => (s.stop_id + " " + s.stop_name + " " + (s.stop_desc || "")).toLowerCase().includes(state.stopSearch.toLowerCase())).slice(0, 30)
        : [];
      const stopList = splitList(cfg.stopIds);
      const gtfsReady = Boolean(state.gtfs);
      const keySet = Boolean(String(cfg.subscriptionKey || "").trim());
      const keyRequired = cfg.requireSubscriptionKey !== false;
      const keyUsable = keySet || !keyRequired;
      const canGo = keyUsable && (gtfsReady || Boolean(state.bundle));
      const defaultStatus = state.bundle
        ? "Board ready — open it below, or adjust stops and rebuild."
        : gtfsReady ? "Timetable loaded — pick your stops, then build the board."
        : "Waiting for timetable data (gtfs.zip)...";

      const keyVal = String(cfg.subscriptionKey || "").trim();
      const keyStatePill = state.keyTest === "ok" ? "done" : state.keyTest === "fail" ? "bad" : "";
      const keyStateLabel = state.keyTest === "ok" ? "&#10003; valid"
        : state.keyTest === "fail" ? "&#10007; failed"
        : state.keyTest === "testing" ? "testing…"
        : keyVal ? "untested" : (cfg.requireSubscriptionKey !== false ? "needed" : "optional");
      const ctaBlocked = (keyRequired && !keySet) ? "Enter your AT API key first"
        : !(gtfsReady || state.bundle) ? "Waiting for timetable data…"
        : "";
      const testedTripHealth = state.realtime && state.realtime.feedHealth && state.realtime.feedHealth.tripUpdates;
      const fullLiveUnavailable = keySet && (state.keyTest === "fail" || (testedTripHealth && !testedTripHealth.ok));
      const setupModeId = keySet ? (fullLiveUnavailable ? "degraded" : "full") : "limited";
      const setupModeLabel = keySet ? (fullLiveUnavailable ? "Degraded until trip updates connect" : "Full live requested") : "Limited live";
      const setupModeDetail = fullLiveUnavailable
        ? "Your personal-key trip updates are not connected. The board will use limited stop predictions and scheduled fallbacks until they recover."
        : keySet
        ? "Trip updates, occupancy and service alerts will use your personal key. Any trip without a prediction still shows its scheduled time."
        : "No personal key: only the limited per-stop prediction source is used. Missing predictions show fixed scheduled clock times; occupancy and alerts are unavailable.";

      const html = `
        <main class="setup">
          <div class="setup-header">
            <h1>Auckland Live Departures</h1>
            <p>Connect once, pick your stops, open the board.</p>
          </div>
          <div class="status-bar ${state.error ? "error" : ""}">${escapeHtml(state.error || state.status || defaultStatus)}</div>

          <div class="connect">
            <div class="connect-pill ${gtfsReady ? "done" : ""}">
              <div class="pill-head">
                <span class="pill-title">Timetable</span>
                <span class="pill-state ${gtfsReady ? "ok" : ""}">${gtfsReady ? "&#10003; loaded" : state.bundle ? "saved board" : "loading…"}</span>
              </div>
              ${gtfsReady
                ? `<div class="pill-sub">${state.gtfs.stops.length.toLocaleString()} stops · ${escapeHtml(state.gtfs.source)}</div>`
                : `<div class="pill-actions">
                     <label class="link-button" style="cursor:pointer">Upload zip<input name="gtfsFile" type="file" accept=".zip" hidden></label>
                     <button class="ghost small" type="button" data-action="fetchGtfs">Retry</button>
                   </div>
                   <div class="pill-sub">Auto-loads <code>gtfs.zip</code> beside this file.</div>`}
            </div>

            <div class="connect-pill ${keyStatePill}">
              <div class="pill-head">
                <span class="pill-title">Your AT API key${state.keyTest === "ok" || !keyRequired ? (keyRequired ? "" : `<span class="req" style="color:var(--muted);border-color:var(--border)">optional</span>`) : `<span class="req">required</span>`}</span>
                <span class="pill-state ${state.keyTest === "ok" ? "ok" : state.keyTest === "fail" ? "bad" : ""}">${keyStateLabel}</span>
              </div>
              ${state.keyTest === "ok"
                ? `<div class="pill-sub">Key accepted${fullLiveUnavailable ? "; trip updates unavailable" : ""}. <button class="linkish" type="button" data-action="editKey">Change key</button></div>`
                : `<div class="pill-actions">
                     <input name="subscriptionKey" type="text" value="${escapeHtml(cfg.subscriptionKey)}" placeholder="Paste your key" class="${state.keyTest === "fail" ? "key-bad" : ""}" autocomplete="off" spellcheck="false" ${keyRequired ? `required aria-required="true"` : ""}>
                     <button class="ghost small" type="button" data-action="fetchRealtime">Test</button>
                   </div>
                   <div class="pill-sub">Free from the <a href="https://dev-portal.at.govt.nz/" target="_blank" rel="noopener">AT Developer Portal &#8599;</a></div>`}
            </div>
          </div>
          <div class="mode-explainer"><span class="mode-dot ${setupModeId}"></span><div><strong>${setupModeLabel}</strong><br>${setupModeDetail}${!keySet && keyRequired ? " Disable the key requirement in Advanced to open in this mode." : ""}</div></div>

          <div class="step focus">
            <h2>Stops &amp; routes<span class="step-status">${stopList.length ? stopList.length + " stop" + (stopList.length !== 1 ? "s" : "") + " selected" : "pick at least one stop"}</span></h2>
            ${gtfsReady
              ? `<div class="field"><input name="stopSearch" placeholder="Search stop name or number, then click + to add…" value="${escapeHtml(state.stopSearch)}"></div>
                 <div class="stop-results">${results.map(s => {
                   const code = s.stop_code && s.stop_code !== s.stop_id ? "Stop " + s.stop_code : "";
                   const meta = [code, s.stop_desc || ""].filter(Boolean).join(" · ");
                   return `<div class="stop-item"><button class="ghost small" type="button" data-stop="${escapeHtml(s.stop_id)}">+</button><span class="name">${escapeHtml(s.stop_name || s.stop_id)}${meta ? `<span class="meta">${escapeHtml(meta)}</span>` : ""}</span><span class="id">${escapeHtml(s.stop_id)}</span></div>`;
                 }).join("")}</div>`
              : `<p class="hint">Load timetable data first to search stops by name.</p>`}
            <div class="chips">${stopList.length
              ? stopList.map(id => `<span class="chip">${escapeHtml(stopDisplayName(id))}<span class="chip-id">${escapeHtml(id)}</span><button type="button" data-removestop="${escapeHtml(id)}" title="Remove stop">&times;</button></span>`).join("")
              : `<span class="hint">No stops selected yet.</span>`}</div>
            <div class="row">
              <div class="field"><label>Only show these routes (comma-separated, blank = all)</label><input name="routeAllowlist" value="${escapeHtml(cfg.routeAllowlist)}"></div>
              <div class="field"><label>Frequent routes — solid cyan pill (blank = all)</label><input name="frequentRoutes" value="${escapeHtml(cfg.frequentRoutes)}"></div>
            </div>
            ${renderPreview()}
          </div>

          <div class="cta-row">
            <button class="primary" data-action="go" ${canGo ? "" : "disabled"} title="${escapeHtml(ctaBlocked || "Open the board")}">${gtfsReady ? (state.bundle ? "Rebuild &amp; open board" : "Build &amp; open board") : state.bundle ? "Open board" : "Build &amp; open board"}</button>
            ${state.bundle && gtfsReady ? `<button class="ghost" data-action="openOnly" ${keyUsable ? "" : "disabled"} title="${escapeHtml(keyUsable ? "Open the saved board without rebuilding" : ctaBlocked)}">Open without rebuilding</button>` : ""}
          </div>

          ${collapsible("advanced", "Advanced", `
            <div class="field"><label>GTFS zip file path or URL</label><input name="gtfsUrl" value="${escapeHtml(cfg.gtfsUrl)}"><div class="hint">Default is <code>gtfs.zip</code> next to this HTML file; <code>gtfs (1).zip</code> is tried as a fallback.</div></div>
            <div class="field"><label>Departures API URL (limited per-stop predictions)</label><input name="departuresUrl" value="${escapeHtml(cfg.departuresUrl)}"><div class="hint">Uses the built-in departures credential. Coverage is incomplete; trips without an expected time remain scheduled.</div></div>
            <div class="field"><label>GTFS-RT trip updates URL</label><input name="realtimeUrl" value="${escapeHtml(cfg.realtimeUrl)}"></div>
            <div class="row">
              <div class="field"><label>Service alerts URL</label><input name="alertsUrl" value="${escapeHtml(cfg.alertsUrl)}"></div>
              <div class="field"><label>Vehicle positions URL (occupancy)</label><input name="vehiclesUrl" value="${escapeHtml(cfg.vehiclesUrl)}"></div>
            </div>
            <div class="field"><label>Stop IDs (raw, comma-separated)</label><textarea name="stopIds">${escapeHtml(cfg.stopIds)}</textarea></div>
            <div class="row">
              <div class="field"><label>Poll interval (sec)</label><input name="pollSeconds" type="number" value="${cfg.pollSeconds}"></div>
              <div class="field"><label>Rows per page</label><input name="pageSize" type="number" value="${cfg.pageSize}"></div>
            </div>
            <div class="row">
              <div class="field"><label>Page rotation (sec)</label><input name="rotateSeconds" type="number" value="${cfg.rotateSeconds}"></div>
              <div class="field"><label>Lookahead (hours)</label><input name="lookaheadHours" type="number" value="${cfg.lookaheadHours}"></div>
            </div>
            <div class="field"><label style="display:flex;align-items:center;gap:.45rem;cursor:pointer"><input name="lockFirstPage" type="checkbox" ${cfg.lockFirstPage ? "checked" : ""} style="width:auto;margin:0"> Lock board to page 1 (never rotate pages)</label></div>
            <div class="field"><label style="display:flex;align-items:center;gap:.45rem;cursor:pointer"><input name="requireSubscriptionKey" type="checkbox" ${cfg.requireSubscriptionKey !== false ? "checked" : ""} style="width:auto;margin:0"> Require a personal AT key before opening the board</label><div class="hint">On: a personal key is required and the board will request Full live mode; feed failures are still surfaced as Degraded. Off: the board can open in Limited live mode, where only some trips receive ETAs and all others show scheduled clock times.</div></div>
            <div class="row">
              <div class="field"><label>Relative time cutoff (min)</label><input name="relativeCutoffMinutes" type="number" value="${cfg.relativeCutoffMinutes}"><div class="hint">Show "12" up to this many minutes out; beyond it show clock time like "14:35".</div></div>
              <div class="field"><label>Stale after (× poll intervals)</label><input name="staleMultiplier" type="number" value="${cfg.staleMultiplier}"></div>
            </div>
            <div class="field"><label>Timezone (IANA)</label><input name="timezone" value="${escapeHtml(cfg.timezone)}"></div>
            ${renderDiagnostics()}
            <div><button class="danger small" type="button" data-action="reset">Reset everything</button></div>
          `, "endpoints · timing · diagnostics")}
        </main>`;
      app.innerHTML = html;
      wireSetup();
    }

    function collapsible(id, title, body, statusText) {
      const open = state.expandedSections[id];
      const status = statusText ? `<span class="section-status">— ${escapeHtml(statusText)}</span>` : "";
      return `<div class="section"><div class="section-header" data-toggle="${id}"><span>${title}${status}</span><span class="arrow ${open ? "open" : ""}">&#9654;</span></div><div class="section-body ${open ? "" : "hidden"}">${body}</div></div>`;
    }

    function wireSetup() {
      document.querySelectorAll("[data-toggle]").forEach(el => {
        el.addEventListener("click", () => {
          state.expandedSections[el.dataset.toggle] = !state.expandedSections[el.dataset.toggle];
          renderSetup();
        });
      });
      const q = s => document.querySelector(s);
      const setStops = ids => {
        readFormIntoConfig();
        state.config.stopIds = Array.from(ids).join(", ");
        saveConfig();
        renderSetup();
      };
      q("[data-action=go]")?.addEventListener("click", () => {
        readFormIntoConfig();
        saveConfig();
        if (state.gtfs) buildBundle();
        else if (state.bundle) { saveConfig({ mode: "board" }); render(); }
      });
      q("[data-action=openOnly]")?.addEventListener("click", () => { readFormIntoConfig(); saveConfig({ mode: "board" }); render(); });
      q("[data-action=reset]")?.addEventListener("click", resetAll);
      q("[data-action=fetchGtfs]")?.addEventListener("click", () => { readFormIntoConfig(); saveConfig(); fetchGtfs(); });
      q("[data-action=editKey]")?.addEventListener("click", () => { state.keyTest = null; renderSetup(); });
      q("[data-action=fetchRealtime]")?.addEventListener("click", () => {
        readFormIntoConfig();
        saveConfig();
        state.keyTest = "testing";
        renderSetup();
        refreshRealtime().then(() => {
          // Judge the user's key by its own feeds, not by whether every feed (incl. AT's
          // flaky alerts/vehicles endpoints) came back clean.
          state.keyTest = state.subKeyOk ? "ok" : "fail";
          renderSetup();
        });
      });
      q("[name=subscriptionKey]")?.addEventListener("input", e => {
        state.config.subscriptionKey = e.target.value;
        state.keyTest = null;
        e.target.classList.remove("key-bad");
        const enabled = Boolean(e.target.value.trim()) || state.config.requireSubscriptionKey === false;
        const go = q("[data-action=go]"); if (go) go.disabled = !enabled || !(state.gtfs || state.bundle);
        const openOnly = q("[data-action=openOnly]"); if (openOnly) openOnly.disabled = !enabled;
      });
      q("[name=requireSubscriptionKey]")?.addEventListener("change", () => { readFormIntoConfig(); saveConfig(); renderSetup(); });
      q("[name=gtfsFile]")?.addEventListener("change", e => { readFormIntoConfig(); saveConfig(); uploadGtfs(e.target.files[0]); });
      q("[name=stopSearch]")?.addEventListener("input", e => {
        state.stopSearch = e.target.value;
        renderSetup();
        const el = document.querySelector("[name=stopSearch]");
        if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      });
      document.querySelectorAll("[data-stop]").forEach(btn => btn.addEventListener("click", () => {
        const ids = new Set(splitList(state.config.stopIds));
        ids.add(btn.dataset.stop);
        setStops(ids);
      }));
      document.querySelectorAll("[data-removestop]").forEach(btn => btn.addEventListener("click", () => {
        const ids = new Set(splitList(state.config.stopIds));
        ids.delete(btn.dataset.removestop);
        setStops(ids);
      }));
      // Fields save themselves — no separate "Save Settings" button.
      document.querySelectorAll(".setup input[name]:not([name=gtfsFile]):not([name=stopSearch]), .setup textarea[name]").forEach(el => {
        el.addEventListener("change", () => { readFormIntoConfig(); saveConfig(); });
      });
    }

    function readFormIntoConfig() {
      const get = n => { const el = document.querySelector(`[name="${n}"]`); return el ? el.value : undefined; };
      const cfg = state.config;
      const v = n => get(n);
      if (v("timezone") !== undefined) cfg.timezone = safeTimezone(v("timezone"));
      if (v("gtfsUrl") !== undefined) cfg.gtfsUrl = v("gtfsUrl");
      if (v("realtimeUrl") !== undefined) cfg.realtimeUrl = v("realtimeUrl");
      if (v("alertsUrl") !== undefined) cfg.alertsUrl = v("alertsUrl");
      if (v("vehiclesUrl") !== undefined) cfg.vehiclesUrl = v("vehiclesUrl");
      if (v("departuresUrl") !== undefined) cfg.departuresUrl = v("departuresUrl");
      if (v("frequentRoutes") !== undefined) cfg.frequentRoutes = v("frequentRoutes");
      if (v("subscriptionKey") !== undefined) cfg.subscriptionKey = v("subscriptionKey");
      if (v("pollSeconds") !== undefined) cfg.pollSeconds = clampNumber(v("pollSeconds"), 60, 5, 3600);
      if (v("pageSize") !== undefined) cfg.pageSize = Math.round(clampNumber(v("pageSize"), 6, 1, 50));
      if (v("rotateSeconds") !== undefined) cfg.rotateSeconds = clampNumber(v("rotateSeconds"), 12, 3, 3600);
      const lockEl = document.querySelector('[name="lockFirstPage"]');
      if (lockEl) { cfg.lockFirstPage = lockEl.checked; state.pageLocked = lockEl.checked; }
      const reqKeyEl = document.querySelector('[name="requireSubscriptionKey"]');
      if (reqKeyEl) cfg.requireSubscriptionKey = reqKeyEl.checked;
      if (v("lookaheadHours") !== undefined) cfg.lookaheadHours = clampNumber(v("lookaheadHours"), 6, 1, 48);
      if (v("relativeCutoffMinutes") !== undefined) cfg.relativeCutoffMinutes = clampNumber(v("relativeCutoffMinutes"), 20, 0, 180);
      if (v("staleMultiplier") !== undefined) cfg.staleMultiplier = clampNumber(v("staleMultiplier"), 2, 1, 20);
      if (v("routeAllowlist") !== undefined) cfg.routeAllowlist = v("routeAllowlist");
      if (v("stopIds") !== undefined) cfg.stopIds = v("stopIds");
    }

    // True when AT is publishing live predictions for our stops but none of them matched
    // a trip in the bundle — the signature of a board built from an outdated GTFS zip.
    function timetableOutdated(rows) {
      const movements = state.realtime && state.realtime.movements;
      if (!movements || !state.bundle) return false;
      const liveMovements = Object.values(movements).filter(m => m.expected).length;
      if (liveMovements < 2) return false;
      return !rows.some(r => r.predictedSource === "at-api");
    }

    function renderBoard() {
      const cfg = state.config;
      const rows = deriveDepartures();
      const pages = [];
      for (let i = 0; i < rows.length; i += cfg.pageSize) pages.push(rows.slice(i, i + cfg.pageSize));
      if (!pages.length) pages.push([]);
      if (state.pageLocked) state.page = 0;
      state.page = state.page % pages.length;
      const pageRows = pages[state.page] || [];
      const pageLabel = pages.length > 1 ? " " + (state.page + 1) + "/" + pages.length : "";
      const hasRT = Boolean(cfg.departuresUrl || (String(cfg.subscriptionKey || "").trim() && (cfg.realtimeUrl || cfg.alertsUrl)));
      const stale = hasRT && !realtimeFresh(state.realtime, cfg, Date.now());
      const mode = operatingMode(pageRows);
      const ambientStatus = mode.id === "full" ? "good" : mode.id === "limited" || mode.label === "Connecting" ? "warn" : "bad";
      const alerts = Array.from(new Set(boardAlerts().map(a => a.header)));
      const frameless = Boolean(cfg.chromeHidden);

      app.innerHTML = `
        <main class="board ${frameless ? "frameless" : ""}">
          <button class="ghost chrome-toggle" data-action="toggleChrome" title="${frameless ? "Show frame and controls" : "Hide frame and controls"}">${frameless ? "+" : "-"}</button>
          <section class="board-shell ${frameless ? "frameless" : ""}">
            <header class="board-header">
              <div class="board-meta">
                <div class="board-meta-top">
                  <span>${escapeHtml(mode.label)}${pageLabel} · ${escapeHtml(mode.coverage)}</span>
                </div>
                <div class="board-controls">
                  <button class="ghost small" data-action="refresh" title="Refresh now">Refresh</button>
                  <button class="${state.pageLocked ? "primary" : "ghost"} small" data-action="lockPage" title="${state.pageLocked ? "Resume rotation through pages" : "Stop on page 1 (no rotation)"}">${state.pageLocked ? "Locked to 1" : "Lock page"}</button>
                  <button class="ghost small" data-action="setup">Settings</button>
                </div>
              </div>
            </header>
            ${!frameless && stale ? `<div class="alert-banner bad">Live data unavailable - showing scheduled times.</div>` : ""}
            ${!frameless && !stale && (state.error || mode.id === "degraded") ? `<div class="alert-banner warn">${escapeHtml(state.error || mode.detail)}</div>` : ""}
            ${!frameless && !stale && timetableOutdated(rows) ? `<div class="alert-banner warn">Timetable data looks outdated - live times can't be matched. Refreshing it automatically; if this persists, update gtfs.zip and rebuild in Settings.</div>` : ""}
            ${!frameless && alerts.length ? `<div class="alert-banner warn">${escapeHtml(alerts[0])}</div>` : ""}
            <div class="board-body">
              ${pageRows.length ? renderTable(pageRows, cfg) : `<div class="empty-state"><div><strong>No departures</strong><br><span>Nothing scheduled in the next ${cfg.lookaheadHours}h.</span></div></div>`}
            </div>
            <footer class="board-footer">
              <div class="legend"><span class="legend-swatch"></span>Frequent services</div>
              <div class="ticker">${alerts.length ? escapeHtml(alerts.join(" · ")) : ""}</div>
              <div class="mode-indicator ${mode.id}" title="${escapeHtml(mode.detail)}"><span class="mode-dot ${mode.id}"></span>${escapeHtml(mode.label)} · ${escapeHtml(mode.coverage)}</div>
              <span class="ambient-status ${ambientStatus}" role="status" aria-label="${escapeHtml(mode.label + ": " + mode.coverage)}" title="${escapeHtml(mode.label + ": " + mode.coverage)}"></span>
              <div class="clock">${clockLabel(state.now, cfg.timezone)}</div>
            </footer>
          </section>
        </main>`;
      document.querySelector("[data-action=toggleChrome]")?.addEventListener("click", () => { saveConfig({ chromeHidden: !state.config.chromeHidden }); renderBoard(); });
      document.querySelector("[data-action=setup]")?.addEventListener("click", () => { saveConfig({ mode: "setup" }); render(); });
      document.querySelector("[data-action=refresh]")?.addEventListener("click", () => { refreshRealtime().then(() => renderBoard()); });
      document.querySelector("[data-action=lockPage]")?.addEventListener("click", () => { state.pageLocked = !state.pageLocked; saveConfig({ lockFirstPage: state.pageLocked }); if (state.pageLocked) state.page = 0; renderBoard(); });
    }

    function renderTable(rows, cfg) {
      const frequent = new Set(splitList(cfg.frequentRoutes).map(normLabel));
      return `<div class="dep-table"><div class="dep-head"><div>Route</div><div>Destination</div><div>Occupancy</div><div>Due</div></div><div class="dep-rows" style="--row-count:${rows.length}">${rows.map(r => {
        // Blank frequent-routes list = every pill filled cyan; otherwise only listed routes are filled, the rest outlined (matches AT PID styling).
        const pillClass = !frequent.size || frequent.has(normLabel(r.routeLabel)) ? "" : " outline";
        const cancelled = r.status === "cancelled";
        const middle = cancelled ? `<span class="badge cancelled">Cancelled</span>` : occupancyIcons(r.occupancy);
        // Live rows (a real prediction) show the moving countdown; rows with no ETA show
        // their fixed scheduled clock time — so a glance tells live from scheduled, the way
        // AT's PID boards do ("3 min" vs "23:15"). Cancelled rows keep their scheduled time.
        const due = (cancelled || r.status === "scheduled")
          ? timeLabel(r.scheduled, cfg.timezone)
          : formatDue(r.effective, state.now.getTime(), cfg);
        return `<div class="dep-row"><div><span class="route-pill${pillClass}">${escapeHtml(r.routeLabel)}</span></div><div><div class="dest-cell"><strong>${escapeHtml(normalizeDestinationLabel(r.destination))}</strong></div></div><div>${middle}</div><div class="due-cell">${due}</div></div>`;
      }).join("")}</div></div>`;
    }

    // A board built from an old GTFS zip is useless with today's realtime: AT rotates
    // trip ids every release, so nothing matches and every row silently degrades to the
    // stale schedule. Rebuild automatically from the current zip when the bundle ages.
    const BUNDLE_MAX_AGE_MS = 3 * 24 * 3600000;
    let bundleRefreshAttempted = false;
    async function maybeRebuildStaleBundle() {
      if (bundleRefreshAttempted || !state.bundle) return;
      const builtAt = Date.parse(state.bundle.generatedAt || "") || 0;
      if (Date.now() - builtAt < BUNDLE_MAX_AGE_MS) return;
      bundleRefreshAttempted = true;
      console.info("[bundle] saved board is " + Math.round((Date.now() - builtAt) / 86400000) + " days old - refreshing from GTFS zip");
      if (await fetchGtfs({ quiet: true })) buildBundle();
      else console.warn("[bundle] automatic refresh failed - keeping the old board");
    }

    function autoLoadSameFolderGtfs() {
      if (state.autoGtfsAttempted || state.gtfs) return;
      state.autoGtfsAttempted = true;
      fetchGtfs({ quiet: true }).then(ok => { if (ok && state.config.mode === "setup") renderSetup(); });
    }

    // Runtime
    function startRuntime() {
      clearTimers();
      timers.push(setInterval(() => { state.now = new Date(); if (state.config.mode === "board") renderBoard(); }, 1000));
      timers.push(setInterval(() => { if (state.config.mode === "board") refreshRealtime().then(() => renderBoard()); }, Math.max(5, state.config.pollSeconds) * 1000));
      timers.push(setInterval(() => { if (state.config.mode === "board" && !state.pageLocked) { state.page++; renderBoard(); } }, Math.max(3, state.config.rotateSeconds) * 1000));
      refreshRealtime().then(() => { if (state.config.mode === "board") renderBoard(); });
    }

    function render() {
      clearTimers();
      const keySet = Boolean(String(state.config.subscriptionKey || "").trim());
      const keyOk = keySet || state.config.requireSubscriptionKey === false;
      if (state.config.mode === "board" && state.bundle && keyOk) { renderBoard(); startRuntime(); maybeRebuildStaleBundle(); }
      else { state.config.mode = "setup"; renderSetup(); autoLoadSameFolderGtfs(); }
    }

    window.addEventListener("error", e => { state.status = "Error: " + (e.message || "unknown"); try { render(); } catch {} });
    window.addEventListener("unhandledrejection", e => { state.status = "Error: " + (e.reason?.message || e.reason || "unknown"); try { render(); } catch {} });

    // Debug helpers exposed for console use.
    // Usage: dumpTrip("1033-32504-...") to inspect raw realtime data for a trip.
    //        dumpRows() to see every currently-rendered row with its predictedSource.
    window.dumpTrip = function (tripId) {
      const t = state.realtime && state.realtime.trips && state.realtime.trips[tripId];
      if (!t) { console.log("no realtime trip for", tripId); return null; }
      console.log("trip", tripId, "tripDelay:", t.tripDelay, "s, scheduleRel:", t.scheduleRelationship);
      console.table((t.orderedUpdates || []).map(u => ({
        seq: u.stopSequence, stopId: u.stopId, rel: u.scheduleRelationship,
        arrDelay: u.arrivalDelay, depDelay: u.departureDelay,
        arrTime: u.arrivalTime ? new Date(u.arrivalTime).toLocaleTimeString() : "",
        depTime: u.departureTime ? new Date(u.departureTime).toLocaleTimeString() : ""
      })));
      return t;
    };
    window.dumpRows = function () {
      const rows = deriveDepartures();
      console.table(rows.slice(0, 20).map(r => ({
        route: r.routeLabel, tripId: r.tripId, stopId: r.stopId,
        sched: new Date(r.scheduled).toLocaleTimeString(),
        pred: r.predicted ? new Date(r.predicted).toLocaleTimeString() : "",
        dueMin: Math.round((r.effective - state.now.getTime()) / 60000),
        deltaSec: r.predicted ? Math.round((r.predicted - r.scheduled) / 1000) : null,
        source: r.predictedSource || "scheduled-only", status: r.status
      })));
      return rows;
    };

    render();
  </script>
</body>
</html>
