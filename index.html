    }
    // Advanced → "Restore defaults" groups. Keys reset to DEFAULT_CONFIG values.
    const ADVANCED_GROUPS = {
      display: ["pageSize", "rotateSeconds", "lookaheadHours", "relativeCutoffMinutes", "lockFirstPage"],
      live: ["pollSeconds", "staleMultiplier", "requireSubscriptionKey"],
      colours: ["routeColors"],
      sources: ["gtfsUrl", "departuresUrl", "realtimeUrl", "alertsUrl", "vehiclesUrl", "timezone"]
    };

    function renderDiagnostics() {
      return `<div class="debug-grid">${diagnostics().map(([label, value]) => `<div class="debug-item"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`).join("")}</div>`;
    }

    // Status
    function setStatus(msg, isError) {
      state.status = msg || "";
      state.error = isError ? msg : "";
      render();
    }

    // Config helpers
    function saveConfig(patch = {}) {
      Object.assign(state.config, patch);
      sanitizeConfig(state.config);
      saveJson("config", state.config);
    }
    function applyPreset(id) {
      const preset = PRESETS[id];
      if (!preset) return;
      saveConfig(preset.config);
      state.page = 0;
      state.status = "Applied preset: " + preset.label + ".";
      state.error = "";
      renderSetup();
    }
    function resetAll() {
      try { Object.keys(localStorage).filter(k => k.startsWith(STORE_KEY)).forEach(k => localStorage.removeItem(k)); } catch {}
      realtimeRequestSeq++;
      gtfsLoadSeq++;
      bundleBuildSeq++;
      state.gtfsLoading = false;
      state.config = Object.assign({}, DEFAULT_CONFIG);
      state.bundle = null; state.gtfs = null; state.realtime = null;
      state.status = ""; state.error = ""; state.refreshing = false; state.refreshFailed = false;
      state.autoGtfsAttempted = false;
      state.page = 0; state.pageLocked = false; state.colorDemo = false; state.keyTest = null;
      bundleRefreshAttempted = false;
      render();
    }

    // Rendering
    function stopDisplayName(stopId) {
      if (state.gtfs) {
        const s = state.gtfs.stops.find(s => s.stop_id === stopId);
        if (s && s.stop_name) return s.stop_name;
      }
      const b = state.bundle && state.bundle.stops && state.bundle.stops[stopId];
      return (b && b.name) || stopId;
    }

    // Setup screen: pick a layout, fill its slots, tune the look, open the board.
    // Fields save themselves and the board rebuilds in the background, so there is no
    // separate build step.
    const SLOT_FIELDS = ["main", "left", "right", "trainLeft", "trainRight"];
    const SETUP_LAYOUTS = [
      { id: "single", name: "Single list", desc: "One list. Add more than one stop to merge them.", thumb: `<i></i>` },
      { id: "dual", name: "Two stops", desc: "Side by side, e.g. both directions.", thumb: `<i></i><i></i>` },
      { id: "fourway", name: "Buses and trains", desc: "Two stops, each with a train platform underneath.", thumb: `<span><i></i><i class="t"></i></span><span><i></i><i class="t"></i></span>` }
    ];

    function setupLayout(cfg = state.config) {
      return fourWayEnabled(cfg) ? "fourway" : cfg.dualStopMode ? "dual" : "single";
    }
    // The left/right stop actually chosen for a side, or "" (dualStopIds falls back to any stop).
    function slotStopId(side, cfg = state.config) {
      const id = side === "left" ? cfg.dualStopLeftId : cfg.dualStopRightId;
      return splitList(cfg.stopIds).includes(id) ? id : "";
    }
    function setupBusStopIds(cfg = state.config) {
      return setupLayout(cfg) === "single" ? splitList(cfg.stopIds) : [slotStopId("left", cfg), slotStopId("right", cfg)].filter(Boolean);
    }
    function keyMode(cfg = state.config) {
      if (String(cfg.subscriptionKey || "").trim() || state.editingKey) return "personal";
      if (HAS_BUILTIN_KEY) return "builtin";
      return cfg.requireSubscriptionKey === false ? "none" : "personal";
    }

    // Everything that stops the board opening, each tied to the field that fixes it.
    function setupBlockers(cfg = state.config) {
      const out = [];
      if (setupLayout(cfg) === "single") {
        if (!splitList(cfg.stopIds).length) out.push({ field: "main", message: "Add a stop" });
      } else {
        if (!slotStopId("left", cfg)) out.push({ field: "left", message: "Choose the left stop" });
        if (!slotStopId("right", cfg)) out.push({ field: "right", message: "Choose the right stop" });
        if (fourWayEnabled(cfg)) {
          const [left, right] = trainPlatformIds(cfg);
          if (!left) out.push({ field: "trainLeft", message: "Choose the left train platform" });
          if (!right) out.push({ field: "trainRight", message: "Choose the right train platform" });
        }
      }
      if (cfg.requireSubscriptionKey !== false && !subscriptionKey(cfg)) out.push({ field: "key", message: HAS_BUILTIN_KEY ? "Add your AT key" : "Add an AT key, or choose No key" });
      if (!state.gtfs && !bundleHasSelectedStops(cfg)) out.push({ field: "timetable", message: state.gtfsLoading ? "Wait for the timetable to load" : "Load the timetable" });
      return out;
    }

    function setLayout(id) {
      const cfg = state.config;
      if (id === "single") saveConfig({ dualStopMode: false, fourWayMode: false });
      else {
        const [left, right] = dualStopIds(cfg);
        saveConfig({
          dualStopMode: true, fourWayMode: id === "fourway",
          dualStopLeftId: left || "", dualStopRightId: right || "",
          stopIds: [left, right].filter(Boolean).join(", "),
          // Rows per page includes the two train rows.
          pageSize: id === "fourway" ? Math.max(3, cfg.pageSize) : cfg.pageSize
        });
      }
      renderSetup();
      scheduleAutoBuild();
    }

    function chooseSlotStop(slot, id) {
      const cfg = state.config;
      if (slot === "main") saveConfig({ stopIds: Array.from(new Set([...splitList(cfg.stopIds), id])).join(", ") });
      else if (slot === "left" || slot === "right") {
        const patch = slot === "left" ? { dualStopLeftId: id } : { dualStopRightId: id };
        const left = slot === "left" ? id : slotStopId("left");
        const right = slot === "right" ? id : slotStopId("right");
        saveConfig(Object.assign(patch, { stopIds: Array.from(new Set([left, right].filter(Boolean))).join(", ") }));
      } else saveConfig(slot === "trainLeft" ? { trainLeftStopId: id, trainLeftRoutes: "" } : { trainRightStopId: id, trainRightRoutes: "" });
      const picker = state.pickers[slot];
      if (picker) Object.assign(picker, { open: false, query: "", active: 0 });
      renderSetup();
      scheduleAutoBuild();
    }

    // Background rebuild after stops or route filters change, so the preview is real and
    // Open board is instant. A change made mid-build queues one more build.
    function scheduleAutoBuild() {
      clearTimeout(state.autoBuildTimer);
      state.autoBuildTimer = setTimeout(autoBuild, 400);
    }
    async function autoBuild() {
      if (!state.gtfs || state.config.mode !== "setup") return;
      if (state.building) { state.buildQueued = true; return; }
      if (setupBlockers().some(b => SLOT_FIELDS.includes(b.field))) return;
      state.building = true;
      refreshSetupPreview();
      try { await buildBundle({ open: false }); }
      finally {
        state.building = false;
        if (state.buildQueued) { state.buildQueued = false; autoBuild(); }
        else if (state.config.mode === "setup") renderSetup();
      }
    }
    async function openBoardFromSetup() {
      readFormIntoConfig();
      saveConfig();
      const blockers = setupBlockers();
      if (blockers.length) { focusSetupField(blockers[0].field); return; }
      clearTimeout(state.autoBuildTimer);
      if (state.gtfs) await buildBundle();
      else { saveConfig({ mode: "board" }); render(); }
    }
    function focusSetupField(field) {
      if (field === "key" || field === "timetable") { state.connectOpen = true; renderSetup(); }
      const target = document.querySelector(`[data-field="${field}"]`);
      if (!target) return;
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      const input = target.querySelector("input:not([type=hidden]):not([type=file]), button");
      if (input) setTimeout(() => input.focus({ preventScroll: true }), 250);
    }

    // Routes serving a stop, for the route pills. Filled from the cached stop_times scan;
    // null while that scan is still running.
    function sortRoutes(list) {
      return list.sort((a, b) => a.label.localeCompare(b.label, "en", { numeric: true }));
    }
    function routesAtStop(stopId) {
      if (!stopId) return [];
      const gtfs = state.gtfs;
      if (gtfs) {
        const known = gtfs.routesByStop && gtfs.routesByStop[stopId];
        if (known) return known;
        loadStopRoutes([stopId]);
        return null;
      }
      // No timetable yet: fall back to the saved board (already narrowed by the route filter).
      const bundle = state.bundle;
      const times = bundle && bundle.stopTimesByStop && bundle.stopTimesByStop[stopId];
      if (!times) return [];
      const seen = new Map();
      for (const st of times) {
        const route = bundle.routes[st.routeId];
        if (route && !seen.has(route.shortName)) seen.set(route.shortName, { label: route.shortName, type: route.type });
      }
      return sortRoutes(Array.from(seen.values()));
    }
    function loadStopRoutes(ids) {
      const gtfs = state.gtfs;
      if (!gtfs) return;
      const pending = gtfs.routesPending ||= new Set();
      const byStop = gtfs.routesByStop ||= {};
      const todo = ids.filter(id => id && !pending.has(id) && !byStop[id]);
      if (!todo.length) return;
      todo.forEach(id => pending.add(id));
      selectedStopTimesFor(new Set(todo)).then(rows => {
        const routesById = gtfs.routesById ||= new Map(gtfs.routes.map(r => [r.route_id, r]));
        const tripsById = gtfs.tripsById ||= new Map(gtfs.trips.map(t => [t.trip_id, t]));
        const found = Object.fromEntries(todo.map(id => [id, new Map()]));
        for (const st of rows) {
          if (String(st.pickup_type) === "1" || !found[st.stop_id]) continue;
          const trip = tripsById.get(st.trip_id);
          const route = trip && routesById.get(trip.route_id);
          if (!route) continue;
          const label = route.route_short_name || route.route_long_name || route.route_id;
          found[st.stop_id].set(label, { label, type: Number(route.route_type) });
        }
        for (const id of todo) byStop[id] = sortRoutes(Array.from(found[id].values()));
      }).catch(err => {
        console.warn("[setup] could not list routes:", err && err.message || err);
        for (const id of todo) byStop[id] = [];
      }).finally(() => {
        todo.forEach(id => pending.delete(id));
        if (state.gtfs === gtfs && state.config.mode === "setup") renderSetup();
      });
    }
    function unionRoutes(ids) {
      const lists = ids.map(routesAtStop);
      if (lists.some(list => list === null)) return null;
      const seen = new Map();
      lists.flat().forEach(route => { if (!seen.has(route.label)) seen.set(route.label, route); });
      return sortRoutes(Array.from(seen.values()));
    }
    function setupRoutesFor(field) {
      if (field === "routeAllowlist") return unionRoutes(setupBusStopIds());
      const routes = routesAtStop(field === "trainLeftRoutes" ? state.config.trainLeftStopId : state.config.trainRightStopId);
      return routes && (state.gtfs ? routes.filter(r => r.type === 2) : routes);
    }
    function chipStyle(label, cfg = state.config) {
      const custom = parseRouteColors(cfg.routeColors).get(normLabel(label));
      return custom ? `background:${custom.background};color:${custom.text};border-color:${custom.background}` : "";
    }
    function routeChipsHtml(field, emptyText) {
      const routes = setupRoutesFor(field);
      if (routes === null) return `<div class="hint">Finding routes…</div>`;
      if (!routes.length) return `<div class="hint">${escapeHtml(emptyText)}</div>`;
      const allowed = new Set(splitList(state.config[field]).map(normLabel));
      const isOn = r => !allowed.size || allowed.has(normLabel(r.label));
      const onCount = routes.filter(isOn).length;
      return `<div class="su-chips">${routes.map(r => `<button type="button" class="su-chip ${isOn(r) ? "" : "off"}" aria-pressed="${isOn(r)}" data-route-field="${field}" data-route="${escapeHtml(r.label)}" style="${chipStyle(r.label)}">${escapeHtml(r.label)}</button>`).join("")}</div>
        <div class="hint">${onCount === routes.length ? `All ${routes.length} shown. Click a route to hide it.` : `Showing ${onCount} of ${routes.length}. <button class="linkish" type="button" data-route-all="${field}">Show all</button>`}</div>`;
    }
    function toggleRoute(field, label) {
      const routes = setupRoutesFor(field);
      if (!routes) return;
      const allowed = new Set(splitList(state.config[field]).map(normLabel));
      let on = routes.filter(r => !allowed.size || allowed.has(normLabel(r.label))).map(r => r.label);
      on = on.includes(label) ? on.filter(l => l !== label) : on.concat(label);
      if (!on.length) return; // Hiding every route would show nothing; keep at least one.
      saveConfig({ [field]: on.length === routes.length ? "" : on.join(", ") });
      renderSetup();
      scheduleAutoBuild();
    }

    // Stop search. Picker state lives in state.pickers so it survives re-renders.
    function isTrainPlatform(stop) {
      // Bus stands at stations have letter platform codes ("Stop A Henderson Station").
      return /train station/i.test(stop.stop_name || "") || (/^\d+$/.test(stop.platform_code || "") && /station/i.test(stop.stop_name || ""));
    }
    function stopLabelParts(stopId) {
      const s = state.gtfs && state.gtfs.stops.find(stop => stop.stop_id === stopId);
      const b = state.bundle && state.bundle.stops && state.bundle.stops[stopId];
      const platform = (s && s.platform_code) || (b && b.platformCode) || "";
      return { name: stopDisplayName(stopId), code: (s && s.stop_code) || stopId.split("-")[0], platform };
    }
    function pickerMatches(kind, query) {
      const q = query.trim().toLowerCase();
      if (!state.gtfs || !q) return [];
      const scored = [];
      for (const s of state.gtfs.stops) {
        if (s.location_type === "1" || (kind === "train" && !isTrainPlatform(s))) continue;
        const name = String(s.stop_name || "").toLowerCase(), code = String(s.stop_code || "").toLowerCase();
        const score = code === q || s.stop_id === query.trim() ? 0 : name.startsWith(q) ? 1 : (name + " " + code + " " + s.stop_id + " " + (s.stop_desc || "")).toLowerCase().includes(q) ? 2 : -1;
        if (score >= 0) scored.push([score, s]);
      }
      return scored.sort((a, b) => a[0] - b[0] || String(a[1].stop_name).localeCompare(String(b[1].stop_name))).slice(0, 12).map(x => x[1]);
    }
    function pickerHtml(slot, kind, value, placeholder) {
      const p = state.pickers[slot] ||= { query: "", open: false, active: 0 };
      if (value && !p.open) {
        const { name, code, platform } = stopLabelParts(value);
        return `<div class="su-picked"><span class="su-picked-name">${escapeHtml(name)}${platform ? ` · Platform ${escapeHtml(platform)}` : ""}</span><span class="su-code">${escapeHtml(code)}</span><button class="ghost small" type="button" data-picker-change="${slot}">Change</button></div>`;
      }
      if (!state.gtfs) return `<div class="hint">${state.gtfsLoading ? "Loading the timetable so you can search stops…" : "Load the timetable to search stops."}</div>`;
      const results = p.open ? pickerMatches(kind, p.query) : [];
      p.active = Math.min(p.active, Math.max(0, results.length - 1));
      const list = !p.open ? "" : !p.query.trim()
        ? `<div class="su-results"><div class="su-empty">${kind === "train" ? "Type a station name, like Henderson" : "Type a stop name or number"}</div></div>`
        : `<div class="su-results" role="listbox">${results.length ? results.map((s, i) => `<button type="button" role="option" data-pick="${escapeHtml(s.stop_id)}" data-pick-slot="${slot}" class="${i === p.active ? "active" : ""}"><span>${escapeHtml(s.stop_name || s.stop_id)}${s.platform_code ? ` · Platform ${escapeHtml(s.platform_code)}` : ""}</span><span class="su-code">${escapeHtml(s.stop_code || s.stop_id.split("-")[0])}</span></button>`).join("") : `<div class="su-empty">No stops match “${escapeHtml(p.query)}”.</div>`}</div>`;
      return `<div class="su-picker"><input type="search" data-picker-input="${slot}" data-picker-kind="${kind}" data-focus-key="picker-${slot}" value="${escapeHtml(p.query)}" placeholder="${escapeHtml(placeholder)}" autocomplete="off" aria-expanded="${p.open}">${list}</div>`;
    }
    function blockerHtml(field, blockers) {
      const b = blockers.find(x => x.field === field);
      return b ? `<div class="su-blocker">${escapeHtml(b.message)}</div>` : "";
    }

    // Preview from the real (background-built) board.
    function setupDueLabel(row, cfg) {
      if (row.status === "cancelled") return "Cancelled";
      if (row.status === "scheduled") return timeLabel(row.scheduled, cfg.timezone);
      const due = formatDue(row.effective, state.now.getTime(), cfg);
      return /^\d+$/.test(due) ? due + " min" : due;
    }
    function renderSetupPreview() {
      const cfg = state.config;
      const blockers = setupBlockers(cfg);
      if (!bundleHasSelectedStops(cfg)) {
        const text = blockers.some(b => SLOT_FIELDS.includes(b.field)) ? "Choose your stops to see a preview."
          : state.building ? "Building the preview…"
          : state.gtfs ? "The preview appears in a moment."
          : state.gtfsLoading ? "Loading the timetable…" : "The preview appears once the timetable loads.";
        return `<div class="su-preview-empty">${text}</div>`;
      }
      state.now = new Date();
      let rows = [];
      try { rows = deriveDepartures(); } catch { rows = []; }
      const routeType = row => Number(state.bundle.routes[row.routeId]?.type);
      const rowHtml = (r, train) => `<div class="su-prow ${train ? "train" : ""}"><span class="su-ppill" style="${chipStyle(r.routeLabel, cfg)}">${escapeHtml(r.routeLabel)}</span><span class="su-pdest">${escapeHtml(normalizeDestinationLabel(r.destination))}</span><span class="su-pdue">${setupDueLabel(r, cfg)}</span></div>`;
      const band = (title, busRows, trainRows, trainTitle) => `<div class="su-pband"><h4>${escapeHtml(title)}</h4>${busRows.length ? busRows.map(r => rowHtml(r)).join("") : `<div class="su-preview-empty small">No upcoming departures</div>`}${trainRows ? `<div class="su-ptrain-title">${escapeHtml(trainTitle)}</div>${trainRows.length ? trainRows.map(r => rowHtml(r, true)).join("") : `<div class="su-preview-empty small">No upcoming trains</div>`}` : ""}</div>`;
      let bands;
      if (!cfg.dualStopMode) {
        const ids = splitList(cfg.stopIds);
        bands = [band(ids.length > 1 ? ids.length + " stops" : stopDisplayName(ids[0]), rows.slice(0, cfg.pageSize))];
      } else {
        const four = fourWayEnabled(cfg);
        const platforms = trainPlatformIds(cfg);
        const labels = [cfg.dualStopLeftLabel, cfg.dualStopRightLabel];
        bands = dualStopIds(cfg).map((stopId, i) => {
          const bus = rows.filter(r => r.stopId === stopId && (!four || routeType(r) === 3)).slice(0, four ? Math.max(3, cfg.pageSize) - 2 : cfg.pageSize);
          const trains = four ? rows.filter(r => r.stopId === platforms[i] && routeType(r) === 2 && trainRoutesMatch(state.bundle.routes[r.routeId], i === 0 ? cfg.trainLeftRoutes : cfg.trainRightRoutes)).slice(0, 2) : null;
          return band(String(labels[i] || "").trim() || stopDisplayName(stopId), bus, trains, cfg.trainStationLabel || stopDisplayName(platforms[i]));
        });
      }
      return `<div class="su-preview ${state.building ? "building" : ""}"><div class="su-pbands" style="grid-template-columns:repeat(${bands.length},minmax(0,1fr))">${bands.join("")}</div>
        <div class="su-pfoot"><span>${cfg.lockFirstPage ? "Stays on page 1" : "Next page every " + cfg.rotateSeconds + "s"}</span><span>${escapeHtml(clockLabel(state.now, cfg.timezone))}</span></div></div>`;
    }
    function setupValueLabel(key, value) {
      if (key === "pageSize") return value + (value === 1 ? " row" : " rows");
      if (key === "rotateSeconds") return value + " sec";
      if (key === "relativeCutoffMinutes") return value ? value + " min away" : "never";
      return String(value);
    }
    function renderSetupFooter() {
      const blockers = setupBlockers();
      return blockers.length
        ? `<div class="su-footer-msg todo">Before you open the board: <button class="linkish" type="button" data-jump="${blockers[0].field}">${escapeHtml(blockers[0].message.toLowerCase())}</button>${blockers.length > 1 ? ` and ${blockers.length - 1} more` : ""}</div>`
        : `<div class="su-footer-msg">Ready. Changes save automatically.</div>`;
    }
    function refreshSetupPreview() {
      const preview = document.querySelector("[data-setup-preview]");
      if (preview) preview.innerHTML = renderSetupPreview();
      const footer = document.querySelector("[data-setup-footer]");
      if (footer) { footer.innerHTML = renderSetupFooter(); wireSetupFooter(); }
    }

    function renderConnection(cfg) {
      const mode = keyMode(cfg);
      const keySet = Boolean(subscriptionKey(cfg));
      const keyRequired = cfg.requireSubscriptionKey !== false;
      const testedTripHealth = state.realtime && state.realtime.feedHealth && state.realtime.feedHealth.tripUpdates;
      const degraded = keySet && (state.keyTest === "fail" || (testedTripHealth && !testedTripHealth.ok));
      const live = !keySet && keyRequired ? { id: "needed", label: "Key needed" }
        : !keySet ? { id: "limited", label: "Limited live" }
        : degraded ? { id: "degraded", label: "Degraded" } : { id: "full", label: "Live" };
      const keyText = { builtin: "built-in AT key", personal: keySet ? "your AT key" : "no key yet", none: "no key" }[mode];
      const savedBoardReady = bundleHasSelectedStops(cfg);
      const timetable = state.gtfsLoading ? `<span class="item"><b>Timetable</b><span class="loader-copy" style="font-weight:400">loading<span></span></span></span>`
        : state.gtfs ? `<span class="item"><b>Timetable</b>${state.gtfs.stops.length.toLocaleString()} stops</span>`
        : savedBoardReady ? `<span class="item"><b>Timetable</b>using saved board</span>`
        : `<span class="item bad"><b>Timetable</b>not loaded</span>`;
      const needsAttention = (keyRequired && !keySet) || state.editingKey || state.keyTest === "fail" || (mode === "personal" && state.keyTest !== "ok") || (!state.gtfs && !state.gtfsLoading && !savedBoardReady);
      const open = state.connectOpen ?? needsAttention;
      const keyNote = state.keyTest === "ok" ? `<span class="su-ok">&#10003; Key works${degraded ? ", but trip updates are unavailable" : ""}</span>`
        : state.keyTest === "fail" ? `<span class="su-bad">&#10007; AT didn’t accept this key</span>`
        : state.keyTest === "testing" ? `<span class="muted">Testing…</span>` : "";
      const option = (value, title, detail, extra = "") => `<label class="su-radio"><input type="radio" name="keyMode" value="${value}" ${mode === value ? "checked" : ""}><span><strong>${title}</strong><br><span class="muted">${detail}</span>${mode === value ? extra : ""}</span></label>`;
      return `<div class="su-status" data-field="connection">
          <span class="item"><span class="su-dot ${live.id}"></span><b>${live.label}</b>${keyText}</span>
          ${timetable}
          <span class="su-spacer"></span>
          <button class="linkish" type="button" data-action="toggleConnection" aria-expanded="${open}">${open ? "Hide connection" : "Connection settings"}</button>
        </div>
        <div class="su-connect" ${open ? "" : "hidden"}>
          <div class="su-connect-group" data-field="key">
            <h3>Live data</h3>
            ${HAS_BUILTIN_KEY ? option("builtin", "Use the built-in AT key", "Full live times, alerts and how full the bus is.", `<span class="su-inline"><button class="linkish" type="button" data-action="fetchRealtime">Test connection</button> ${keyNote}</span>`) : ""}
            ${option("personal", "Use your own key", `Free from the <a href="https://dev-portal.at.govt.nz/" target="_blank" rel="noopener">AT Developer Portal &#8599;</a>.`,
              `<span class="su-inline"><input name="subscriptionKey" type="password" value="${escapeHtml(cfg.subscriptionKey)}" placeholder="Paste your key" data-focus-key="subscriptionKey" class="${state.keyTest === "fail" ? "key-bad" : ""}" autocomplete="off" spellcheck="false"><button class="ghost small" type="button" data-action="fetchRealtime">Test</button></span><span class="su-inline">${keyNote}</span>`)}
            ${HAS_BUILTIN_KEY ? "" : option("none", "No key", "Some live times; the rest show the timetable. No alerts or occupancy.")}

    function renderSetup() {
      const cfg = state.config;

          ${four ? `<div class="su-train" data-field="train${Side}"><label class="su-label">Train platform</label>${pickerHtml("train" + Side, "train", cfg["train" + Side + "StopId"], "Search station or platform")}${blockerHtml("train" + Side, blockers)}

        ? `<div class="su-slot ${blockers.some(b => b.field === "main") ? "blocked" : ""}" data-field="main">
            ${busStops.length ? `<div class="chips">${busStops.map(id => { const p = stopLabelParts(id); return `<span class="chip">${escapeHtml(p.name)}<span class="chip-id">${escapeHtml(p.code)}</span><button type="button" data-removestop="${escapeHtml(id)}" title="Remove stop" aria-label="Remove ${escapeHtml(p.name)}">&times;</button></span>`; }).join("")}</div>` : ""}
            <div><label class="su-label">${busStops.length ? "Add another stop" : "Bus stop"}</label>${pickerHtml("main", "bus", "", "Search stop name or number")}${blockerHtml("main", blockers)}</div>
          </div>`
        : `<div class="su-slots">
            ${four ? `<div class="su-station"><label class="su-label" for="su-station">Station heading <span class="muted">(optional)</span></label><input id="su-station" data-cfg="trainStationLabel" data-live data-focus-key="trainStationLabel" value="${escapeHtml(cfg.trainStationLabel)}" placeholder="Uses the platform’s stop name"></div>` : ""}
            ${sideSlot("left")}${sideSlot("right")}

      const html = `
        <main class="setup su">

            <h1>Auckland Live Departures</h1>

          <div class="su-grid">
            <div class="su-form">

              <section class="su-section">
                <h2><span class="su-n done">1</span>Choose a layout</h2>
                <div class="su-layouts" role="radiogroup" aria-label="Board layout">
                  ${SETUP_LAYOUTS.map(l => `<button type="button" class="su-layout" role="radio" aria-checked="${layout === l.id}" data-layout="${l.id}"><span class="su-thumb ${l.id}">${l.thumb}</span><span><strong>${l.name}</strong><span class="su-desc">${l.desc}</span></span></button>`).join("")}
                </div>
              </section>

              <section class="su-section">
                <h2><span class="su-n ${slotsDone ? "done" : ""}">2</span>${layout === "single" ? "Choose your stops" : four ? "Choose stops and platforms" : "Choose your two stops"}<small>${slotsDone ? "Ready" : blockers.filter(b => SLOT_FIELDS.includes(b.field)).length + " to go"}</small></h2>
                ${stopsBody}

              <section class="su-section">

                <div class="su-look">
                  ${[["pageSize", "Rows per page", 1, Math.max(12, cfg.pageSize), 1, four ? "Includes the two train rows." : ""], ["rotateSeconds", "Next page every", 3, Math.max(60, cfg.rotateSeconds), 1, ""], ["relativeCutoffMinutes", "Show “min” until", 0, 180, 5, "After that, show the clock time, like 14:35."]].map(([key, label, min, max, step, hint]) => `
                    <div><label class="su-label" for="su-${key}">${label} <output data-out="${key}">${setupValueLabel(key, cfg[key])}</output></label><input type="range" id="su-${key}" data-cfg="${key}" data-focus-key="${key}" min="${min}" max="${max}" step="${step}" value="${cfg[key]}" ${key === "rotateSeconds" && cfg.lockFirstPage ? "disabled" : ""}>${hint ? `<div class="hint">${hint}</div>` : ""}</div>`).join("")}
                </div>
                <label class="checkbox-label plain su-check"><input type="checkbox" data-cfg="lockFirstPage" data-rerender ${cfg.lockFirstPage ? "checked" : ""}> Stay on page 1 (don’t rotate)</label>
                <details class="su-more" ${state.expandedSections.colours ? "open" : ""} data-details="colours">
                  <summary>Route colours <span class="muted">${colours.length} routes</span></summary>
                  <div class="su-colours">
                    ${colours.map((c, i) => `<div class="su-colour-row"><span class="su-ppill" style="background:${c.background};color:${c.text}">${escapeHtml(c.route)}</span>
                      <input type="color" value="${c.background}" data-colour="${i}" data-part="background" aria-label="${escapeHtml(c.route)} background">

                  <div style="margin-top:.6rem"><label class="su-label" for="su-frequent">Routes with a solid pill <span class="muted">(blank = all)</span></label><input id="su-frequent" data-cfg="frequentRoutes" data-live data-focus-key="frequentRoutes" value="${escapeHtml(cfg.frequentRoutes)}" placeholder="70, NX1, OUT"><div class="hint">Other routes without a custom colour get an outlined pill.</div></div>
                </details>

              <details class="su-section su-more-settings" ${state.expandedSections.advanced ? "open" : ""} data-details="advanced">

                <div class="su-adv">

                    <div class="field"><label for="adv-poll">Refresh every</label><div class="unit-input"><input id="adv-poll" data-cfg="pollSeconds" type="number" min="5" max="3600" step="1" value="${cfg.pollSeconds}"><span>sec</span></div></div>
                    <div class="field"><label for="adv-stale">Mark stale after</label><div class="unit-input"><input id="adv-stale" data-cfg="staleMultiplier" type="number" min="1" max="20" step="1" value="${cfg.staleMultiplier}"><span>missed refreshes</span></div></div>
                  </div>
                  <div class="adv-group">
                    <div class="adv-head"><h3>Data sources</h3><button class="linkish" type="button" data-restore="sources">Restore defaults</button></div>
                    <div class="field"><label for="adv-gtfs">Timetable (GTFS zip or folder URL)</label><input id="adv-gtfs" data-cfg="gtfsUrl" value="${escapeHtml(cfg.gtfsUrl)}"><div class="hint">A URL ending in / loads unpacked .txt files.</div></div>
                    <div class="field"><label for="adv-dep">Stop predictions API</label><input id="adv-dep" data-cfg="departuresUrl" value="${escapeHtml(cfg.departuresUrl)}"></div>
                    <div class="field"><label for="adv-rt">Trip updates (GTFS-RT)</label><input id="adv-rt" data-cfg="realtimeUrl" value="${escapeHtml(cfg.realtimeUrl)}"></div>
                    <div class="row">
                      <div class="field"><label for="adv-alerts">Service alerts</label><input id="adv-alerts" data-cfg="alertsUrl" value="${escapeHtml(cfg.alertsUrl)}"></div>
                      <div class="field"><label for="adv-veh">Vehicle positions</label><input id="adv-veh" data-cfg="vehiclesUrl" value="${escapeHtml(cfg.vehiclesUrl)}"></div>
                    </div>
                    <div class="row">
                      <div class="field"><label for="adv-tz">Timezone (IANA)</label><input id="adv-tz" data-cfg="timezone" value="${escapeHtml(cfg.timezone)}"></div>
                      <div class="field"><label for="adv-stops">Stop IDs (raw)</label><input id="adv-stops" data-cfg="stopIds" data-rerender data-rebuild value="${escapeHtml(cfg.stopIds)}" spellcheck="false"></div>
                    </div>
                  </div>
                  <div class="adv-group">
                    <div class="adv-head"><h3>Diagnostics</h3><button class="ghost small" type="button" data-action="copyDiagnostics">Copy diagnostics</button></div>
                    ${renderDiagnostics()}
                  </div>
                  <div class="adv-group adv-danger">
                    <div><strong>Reset everything</strong><div class="hint">Clears your key, stops, saved board and all settings on this device.</div></div>
                    <button class="danger small" type="button" data-action="reset">Reset…</button>
                  </div>
                </div>
              </details>
            </div>

            <aside class="su-aside">
              <h2>Preview</h2>
              <div data-setup-preview>${renderSetupPreview()}</div>
              <p class="hint">Real departures for your stops. Updates as you change settings.</p>
            </aside>
          </div>
          <div class="su-footer"><div class="su-footer-inner">
            <div data-setup-footer>${renderSetupFooter()}</div>
            <button class="ghost" type="button" data-action="shareBoard">Share board</button>
            <button class="primary" type="button" data-action="go">Open board</button>
          </div></div>
        </main>`;
      app.innerHTML = html;
      wireSetup();
      if (focusKey && document.querySelector) {
        const el = document.querySelector(`[data-focus-key="${focusKey}"]`);
        if (el) {
          el.focus({ preventScroll: true });
          if (selection && el.setSelectionRange) try { el.setSelectionRange(selection[0], selection[1]); } catch {}
        }
      }
    }

    function wireSetupFooter() {
      document.querySelector("[data-jump]")?.addEventListener("click", e => focusSetupField(e.currentTarget.dataset.jump));
    }

    function wireSetup() {
      const q = s => document.querySelector(s);
      const all = s => document.querySelectorAll ? Array.from(document.querySelectorAll(s)) : [];
      wireShareButton();
      wireSetupFooter();
      q("[data-action=go]")?.addEventListener("click", openBoardFromSetup);
      q("[data-action=toggleConnection]")?.addEventListener("click", e => {
        state.connectOpen = e.currentTarget.getAttribute("aria-expanded") !== "true";
        renderSetup();
      });
      all("[data-details]").forEach(el => el.addEventListener("toggle", () => { state.expandedSections[el.dataset.details] = el.open; }));
      all("[data-layout]").forEach(btn => btn.addEventListener("click", () => setLayout(btn.dataset.layout)));

      // Stop pickers
      all("[data-picker-input]").forEach(input => {
        const slot = input.dataset.pickerInput, p = state.pickers[slot];
        input.addEventListener("focus", () => { if (!p.open) { p.open = true; renderSetup(); } });
        input.addEventListener("input", () => { p.query = input.value; p.open = true; p.active = 0; renderSetup(); });
        input.addEventListener("keydown", e => {
          const results = pickerMatches(input.dataset.pickerKind, p.query);
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault();
            p.active = Math.max(0, Math.min(results.length - 1, p.active + (e.key === "ArrowDown" ? 1 : -1)));
            renderSetup();
          } else if (e.key === "Enter" && results[p.active]) { e.preventDefault(); chooseSlotStop(slot, results[p.active].stop_id); }
          else if (e.key === "Escape") { p.open = false; p.query = ""; renderSetup(); }
        });
        input.addEventListener("blur", () => setTimeout(() => {
          const now = document.activeElement;
          if (p.open && !(now && now.dataset && now.dataset.pickerInput === slot)) { p.open = false; renderSetup(); }
        }, 150));
      });
      all("[data-pick]").forEach(btn => btn.addEventListener("mousedown", e => { e.preventDefault(); chooseSlotStop(btn.dataset.pickSlot, btn.dataset.pick); }));
      all("[data-picker-change]").forEach(btn => btn.addEventListener("click", () => {
        const slot = btn.dataset.pickerChange;
        Object.assign(state.pickers[slot], { open: true, query: "", active: 0 });
        state.focusNext = "picker-" + slot;
        renderSetup();
      }));
      all("[data-removestop]").forEach(btn => btn.addEventListener("click", () => {
        saveConfig({ stopIds: splitList(state.config.stopIds).filter(id => id !== btn.dataset.removestop).join(", ") });
        renderSetup();
        scheduleAutoBuild();
      }));
      all("[data-route-field]").forEach(btn => btn.addEventListener("click", () => toggleRoute(btn.dataset.routeField, btn.dataset.route)));
      all("[data-route-all]").forEach(btn => btn.addEventListener("click", () => { saveConfig({ [btn.dataset.routeAll]: "" }); renderSetup(); scheduleAutoBuild(); }));

      // Settings that save themselves. data-live updates the preview while typing,
      // data-rerender redraws the form, data-rebuild rebuilds the board.
      all("[data-cfg]").forEach(el => {
        const key = el.dataset.cfg;
        const read = () => el.type === "checkbox" ? el.checked : (el.type === "range" || el.type === "number") ? Number(el.value) : el.value;
        el.addEventListener("input", () => {
          if (el.type === "range") {
            state.config[key] = read();
            const out = q(`[data-out="${key}"]`);
            if (out) out.textContent = setupValueLabel(key, state.config[key]);
            refreshSetupPreview();
          } else if (el.dataset.live !== undefined) { state.config[key] = read(); refreshSetupPreview(); }
        });
        el.addEventListener("change", () => {
          const patch = { [key]: key === "timezone" ? safeTimezone(read()) : read() };
          if (key === "lockFirstPage") state.pageLocked = patch[key];
          saveConfig(patch);
          if (el.dataset.rerender !== undefined) renderSetup(); else refreshSetupPreview();
          if (el.dataset.rebuild !== undefined) scheduleAutoBuild();
        });
      });

      // Route colours
      const colourList = () => Array.from(parseRouteColors(state.config.routeColors).values());
      const writeColours = list => saveConfig({ routeColors: list.map(c => `${c.route}: ${c.background} / ${c.text}`).join("\n") });
      all("[data-colour]").forEach(input => {
        input.addEventListener("input", () => {
          const pill = input.parentElement.querySelector(".su-ppill");
          if (pill) pill.style[input.dataset.part === "background" ? "background" : "color"] = input.value;
        });
        input.addEventListener("change", () => {
          const list = colourList();
          list[+input.dataset.colour][input.dataset.part] = input.value.toUpperCase();
          writeColours(list);
          renderSetup();
        });
      });
      all("[data-colour-remove]").forEach(btn => btn.addEventListener("click", () => {
        writeColours(colourList().filter((_, i) => i !== +btn.dataset.colourRemove));
        renderSetup();
      }));
      q("[data-action=addColour]")?.addEventListener("click", () => {
        const route = String(q("[data-new-colour]")?.value || "").trim().toUpperCase();
        if (!route || route.includes(":")) return;
        const list = colourList();
        if (!list.some(c => normLabel(c.route) === normLabel(route))) list.push({ route, background: "#62DDF4", text: "#163047" });
        writeColours(list);
        renderSetup();
      });
      q("[data-action=colorDemo]")?.addEventListener("click", () => {
        readFormIntoConfig();
        saveConfig();
        state.colorDemo = true;
        state.page = 0;
        render();
      });

      // Connection
      all("[name=keyMode]").forEach(radio => radio.addEventListener("change", () => {
        state.keyTest = null;
        if (radio.value === "builtin") { state.editingKey = false; saveConfig({ subscriptionKey: "", requireSubscriptionKey: true }); }
        else if (radio.value === "personal") { state.editingKey = true; state.focusNext = "subscriptionKey"; saveConfig({ requireSubscriptionKey: true }); }
        else { state.editingKey = false; saveConfig({ subscriptionKey: "", requireSubscriptionKey: false }); }
        renderSetup();
      }));
      q("[name=subscriptionKey]")?.addEventListener("input", e => {
        state.config.subscriptionKey = e.target.value;
        state.keyTest = null;
        e.target.classList.remove("key-bad");
        refreshSetupPreview();
      });
      q("[name=subscriptionKey]")?.addEventListener("change", () => saveConfig());
      all("[data-action=fetchRealtime]").forEach(btn => btn.addEventListener("click", () => {
        readFormIntoConfig();
        saveConfig();
        state.keyTest = "testing";
        const testedConfig = JSON.stringify(state.config);
        renderSetup();
        refreshRealtime().then(() => {
          if (JSON.stringify(state.config) !== testedConfig || state.colorDemo) return;
          // Judge the user's key by its own feeds, not by whether every feed (incl. AT's
          // flaky alerts/vehicles endpoints) came back clean.
          state.keyTest = state.subKeyOk ? "ok" : "fail";
          if (state.config.mode === "setup") renderSetup();
        });
      }));
      q("[data-action=fetchGtfs]")?.addEventListener("click", () => { readFormIntoConfig(); saveConfig(); fetchGtfs(); });
      q("[name=gtfsFile]")?.addEventListener("change", e => { readFormIntoConfig(); saveConfig(); uploadGtfs(e.target.files[0]); });

      // More settings
      q("[data-action=reset]")?.addEventListener("click", e => {
        // Two-step confirm (no browser dialog): first click arms, second click within 4s resets.
        const btn = e.currentTarget;
        if (btn.classList.contains("confirming")) { resetAll(); return; }
        btn.classList.add("confirming");
        btn.textContent = "Click again to erase everything";
        setTimeout(() => { if (btn.isConnected) { btn.classList.remove("confirming"); btn.textContent = "Reset…"; } }, 4000);
      });
      all("[data-restore]").forEach(btn => btn.addEventListener("click", () => {
        const keys = ADVANCED_GROUPS[btn.dataset.restore] || [];
        const patch = {};
        keys.forEach(k => { patch[k] = DEFAULT_CONFIG[k]; });
        saveConfig(patch);
        if ("lockFirstPage" in patch) state.pageLocked = Boolean(patch.lockFirstPage);
        state.status = "Restored default " + ({ display: "display", live: "live update", colours: "route colour", sources: "data source" }[btn.dataset.restore] || "") + " settings.";
        state.error = "";
        renderSetup();
      }));
      q("[data-action=copyDiagnostics]")?.addEventListener("click", e => {
        const text = diagnostics().map(([label, value]) => label + ": " + value).join("\n");
        const btn = e.currentTarget;
        const done = ok => { btn.textContent = ok ? "Copied" : "Copy failed"; setTimeout(() => { btn.textContent = "Copy diagnostics"; }, 1800); };
        try { navigator.clipboard.writeText(text).then(() => done(true), () => done(false)); } catch { done(false); }
      });

      // Ask for route lists for the chosen stops up front, and build once per stop set when
      // the saved board doesn't cover them (e.g. right after the timetable loads).
      if (state.gtfs) {
        loadStopRoutes([...setupBusStopIds(), ...(fourWayEnabled() ? trainPlatformIds() : [])]);
        const buildKey = boardStopIds().join("|");
        if (!state.building && !bundleHasSelectedStops() && state.autoBuiltFor !== buildKey) { state.autoBuiltFor = buildKey; scheduleAutoBuild(); }
      }
    }

    // Fields save themselves on change; this catches a value still being typed (like the
    // key) before something else reads the config.
    function readFormIntoConfig() {
      if (!document.querySelectorAll) return;
      document.querySelectorAll(".setup [data-cfg]").forEach(el => {
        const key = el.dataset.cfg;
        state.config[key] = el.type === "checkbox" ? el.checked : (el.type === "range" || el.type === "number") ? Number(el.value) : el.value;
      });
      const keyInput = document.querySelector('.setup [name="subscriptionKey"]');
      if (keyInput) state.config.subscriptionKey = keyInput.value;
      sanitizeConfig(state.config);
    }

    // True when AT is publishing live predictions for our stops but none of them matched
    // a trip in the bundle — the signature of a board built from an outdated GTFS zip.
    function timetableOutdated(rows) {
      const movements = state.realtime && state.realtime.movements;
      if (!movements || !state.bundle) return false;
      const liveMovements = Object.values(movements).filter(m => m.expected).length;
      if (liveMovements < 2) return false;
      return !rows.some(r => r.predictedSource === "at-api");
    }

    function renderDualStopBoards(rows, cfg) {
      const ids = dualStopIds(cfg);
      const labels = [cfg.dualStopLeftLabel, cfg.dualStopRightLabel];
      const fourWay = fourWayEnabled(cfg);
      const busPageSize = fourWay ? Math.max(3, cfg.pageSize) - 2 : cfg.pageSize;
      const platforms = trainPlatformIds(cfg);
      const stopPages = ids.map(stopId => {
        const stopRows = rows.filter(row => row.stopId === stopId && (!fourWay || Number(state.bundle.routes[row.routeId]?.type) === 3));
        const pages = [];
        for (let i = 0; i < stopRows.length; i += busPageSize) pages.push(stopRows.slice(i, i + busPageSize));
        if (!pages.length) pages.push([]);
        return pages;
      });
      const pageCount = Math.max(...stopPages.map(pages => pages.length));
      state.page %= pageCount;
      const bands = ids.map((stopId, index) => {
        const pages = stopPages[index];
        const pageIndex = state.pageLocked ? 0 : state.page % pages.length;
        const pageRows = pages[pageIndex];
        const trainRows = fourWay ? rows.filter(row => row.stopId === platforms[index] && Number(state.bundle.routes[row.routeId]?.type) === 2 && trainRoutesMatch(state.bundle.routes[row.routeId], index === 0 ? cfg.trainLeftRoutes : cfg.trainRightRoutes)).slice(0, 2) : [];
        const trainStop = state.bundle?.stops[platforms[index]];
        const stationName = cfg.trainStationLabel || trainStop?.name || platforms[index];
        const platformLabel = trainStop?.platformCode ? "Platform " + trainStop.platformCode : "Stop " + (platforms[index] || "").split("-")[0];
        const trainContent = fourWay ? `<div class="train-station-strip" title="${escapeHtml(stationName + ' · ' + platformLabel)}">${escapeHtml(stationName)} <span>${escapeHtml(platformLabel)}</span></div>${renderTable(trainRows, { ...cfg, pageSize: 2 }, { slots: 2, hideHeader: true, emptyLabel: "No upcoming trains" })}` : "";
        const stop = state.bundle && state.bundle.stops[stopId];
        const name = String(labels[index] || "").trim() || (stop && stop.name) || stopId;
        return {
          pageRows: [...pageRows, ...trainRows], pageCount: pages.length,
          html: `<section class="dual-band ${fourWay ? "four-way-band" : ""}" aria-label="${escapeHtml(name)} departures">
            <div class="dual-band-header"><div><span class="dual-direction">${escapeHtml(name)}</span><span class="dual-stop-code">Stop ${escapeHtml(stopId.split("-")[0])}</span></div>${pages.length > 1 ? `<span class="dual-page">${pageIndex + 1}/${pages.length}</span>` : ""}</div>
            ${fourWay ? renderTable(pageRows, cfg, { slots: busPageSize, emptyLabel: "No upcoming buses" }) : pageRows.length ? renderTable(pageRows, cfg) : `<div class="empty-state"><div><strong>No departures</strong><br><span>Nothing scheduled in the next ${cfg.lookaheadHours}h.</span></div></div>`}
            ${trainContent}
          </section>`
        };
      });
      return { html: `<div class="dual-bands">${bands.map(b => b.html).join("")}</div>`, pageRows: bands.flatMap(b => b.pageRows), pageCount };
    }

    function fitDualDestinations() {
      document.querySelectorAll(".dual-band .dest-cell strong").forEach(label => {
        label.title = label.textContent;
        const availableHeight = label.parentElement.clientHeight;
        if (!availableHeight) return;
        const preferredSize = parseFloat(getComputedStyle(label).fontSize);
        label.style.maxHeight = "none";
        label.style.overflow = "visible";
        // A name that only just misses one line (e.g. "Manukau via City") reads better slightly
        // smaller on one line than wrapped at full size: allow up to ~12% shrink for that.
        let oneLine = 0;
        for (let size = Math.floor(preferredSize); size >= Math.max(12, Math.floor(preferredSize * 0.88)); size--) {
          label.style.fontSize = size + "px";
          if (label.getBoundingClientRect().height <= size * 1.5) { oneLine = size; break; }
        }
        if (oneLine) {
          label.style.maxHeight = Math.min(oneLine * 2.1, availableHeight) + "px";
          label.style.overflow = "hidden";
          return;
        }
        for (let size = Math.floor(preferredSize); size >= 12; size--) {
          label.style.fontSize = size + "px";
          label.style.maxHeight = "none";
          label.style.overflow = "visible";
          const naturalHeight = label.getBoundingClientRect().height;
          if (naturalHeight <= size * 2.1 + 2 && naturalHeight <= availableHeight + 1) break;
        }
        label.style.maxHeight = Math.min(parseFloat(label.style.fontSize) * 2.1, availableHeight) + "px";
        label.style.overflow = "hidden";
      });
    }

    const lastBoard = { el: null, key: "" };
    function renderBoard() {
      const cfg = state.config;
      const rows = deriveDepartures();
      if (state.pageLocked) state.page = 0;
      let pageRows, pageLabel, boardContent;
      if (cfg.dualStopMode) {
        const dual = renderDualStopBoards(rows, cfg);
        pageRows = dual.pageRows;
        pageLabel = dual.pageCount > 1 ? " " + (state.page + 1) + "/" + dual.pageCount : "";
        boardContent = dual.html;
      } else {
        const pages = [];
        for (let i = 0; i < rows.length; i += cfg.pageSize) pages.push(rows.slice(i, i + cfg.pageSize));
        if (!pages.length) pages.push([]);
        state.page %= pages.length;
        pageRows = pages[state.page] || [];
        pageLabel = pages.length > 1 ? " " + (state.page + 1) + "/" + pages.length : "";
        boardContent = pageRows.length ? renderTable(pageRows, cfg) : `<div class="empty-state"><div><strong>No departures</strong><br><span>Nothing scheduled in the next ${cfg.lookaheadHours}h.</span></div></div>`;
      }
      const hasRT = Boolean(cfg.departuresUrl || (subscriptionKey(cfg) && (cfg.realtimeUrl || cfg.alertsUrl)));
      const stale = hasRT && !realtimeFresh(state.realtime, cfg, Date.now());
      const mode = operatingMode(pageRows);
      const alerts = Array.from(new Set(boardAlerts().map(a => a.header)));
      const notice = stopNotices();
      const frameless = Boolean(cfg.chromeHidden);
      const clock = `<div class="clock">${clockLabel(state.now, cfg.timezone)}</div>`;

      const html = `
        <main class="board ${frameless ? "frameless" : ""} ${cfg.dualStopMode ? "dual-mode" : ""}">
          <button class="ghost chrome-toggle" data-action="toggleChrome" title="${frameless ? "Show frame and controls" : "Hide frame and controls"}">${frameless ? "+" : "-"}</button>
          <section class="board-shell ${frameless ? "frameless" : ""}">
            <header class="board-header">
              <div class="board-meta">
                <div class="board-meta-top">
                  <span>${escapeHtml(mode.label)}${pageLabel} · ${escapeHtml(mode.coverage)}</span>
                </div>
                <div class="board-controls">
                  <button class="ghost small" data-action="refresh" title="Refresh now">Refresh</button>
                  <button class="${state.pageLocked ? "primary" : "ghost"} small" data-action="lockPage" title="${state.pageLocked ? "Resume rotation through pages" : "Stop on page 1 (no rotation)"}">${state.pageLocked ? "Locked to 1" : "Lock page"}</button>
                  <button class="ghost small" data-action="shareBoard">Share</button>
                  <button class="ghost small" data-action="setup">Settings</button>
                </div>
              </div>
            </header>
            ${!frameless && stale ? `<div class="alert-banner bad">Live data unavailable - showing scheduled times.</div>` : ""}
            ${!frameless && !stale && (state.error || mode.id === "degraded") ? `<div class="alert-banner warn">${escapeHtml(state.error || mode.detail)}</div>` : ""}
            ${!frameless && !stale && timetableOutdated(rows) ? `<div class="alert-banner warn">Timetable data looks outdated - live times can't be matched. Refreshing it automatically; if this persists, update gtfs.zip and rebuild in Settings.</div>` : ""}
            ${!frameless && alerts.length ? `<div class="alert-banner warn">${escapeHtml(alerts[0])}</div>` : ""}
            <div class="board-body">
              ${boardContent}
            </div>
            <footer class="board-footer${notice && !(typeof isMotat === "function" && isMotat()) ? " notice notice-" + notice.level : ""}">
              <div class="legend"><span class="legend-swatch"></span>Frequent services</div>
              <div class="ticker">${notice ? noticeMarquee(notice) : ""}</div>
              <div class="mode-indicator ${mode.id}" title="${escapeHtml(mode.detail)}"><span class="mode-dot ${mode.id}"></span>${escapeHtml(mode.label)} · ${escapeHtml(mode.coverage)}</div>
              ${clock}
            </footer>
          </section>
        </main>`;
      // The board redraws every second, but between polls and page turns usually only the clock
      // has changed. Rebuilding the whole DOM each tick is a long task on slow devices (and
      // restarts the marquee), so in that case just update the clock text.
      const key = html.replace(clock, "").replace(/animation-delay:-[\d.]+s/, "");
      if (lastBoard.el && lastBoard.el === app.firstElementChild && lastBoard.key === key) {
        const el = lastBoard.el.querySelector(".clock");
        if (el) el.textContent = clockLabel(state.now, cfg.timezone);
        return;
      }
      app.innerHTML = html;
      lastBoard.el = app.firstElementChild;
      lastBoard.key = key;
      if (cfg.dualStopMode) fitDualDestinations();
      wireShareButton();
      document.querySelector("[data-action=toggleChrome]")?.addEventListener("click", () => { saveConfig({ chromeHidden: !state.config.chromeHidden }); renderBoard(); });
      document.querySelector("[data-action=setup]")?.addEventListener("click", () => { saveConfig({ mode: "setup" }); render(); });
      document.querySelector("[data-action=refresh]")?.addEventListener("click", () => { refreshRealtime().then(() => { if (state.config.mode === "board" && !state.colorDemo) renderBoard(); }); });
      document.querySelector("[data-action=lockPage]")?.addEventListener("click", () => { state.pageLocked = !state.pageLocked; saveConfig({ lockFirstPage: state.pageLocked }); if (state.pageLocked) state.page = 0; renderBoard(); });
    }

    function renderColorDemo() {
      const cfg = state.config;
      state.now = new Date();
      const colors = Array.from(parseRouteColors(cfg.routeColors).values());
      const rows = colors.map((color, index) => {
        const scheduled = state.now.getTime() + (index + 1) * 5 * 60000;
        return {
          routeLabel: color.route,
          destination: "Route Colour Preview",
          occupancy: 0,
          status: "scheduled",
          scheduled,
          effective: scheduled
        };
      });
      const pageSize = Math.max(1, cfg.pageSize);
      const pages = [];
      for (let i = 0; i < rows.length; i += pageSize) pages.push(rows.slice(i, i + pageSize));
      if (!pages.length) pages.push([]);
      state.page = ((state.page % pages.length) + pages.length) % pages.length;
      const pageRows = pages[state.page];

      app.innerHTML = `
        <main class="board">
          <section class="board-shell">
            <header class="board-header">
              <div class="board-meta">
                <div class="board-meta-top"><span>Route colour preview ${state.page + 1}/${pages.length}</span></div>
                <div class="board-controls">
                  <button class="ghost small" data-action="previousDemo">Previous</button>
                  <button class="primary small" data-action="nextDemo">Next colours</button>
                  <button class="ghost small" data-action="setup">Back to settings</button>
                </div>
              </div>
            </header>
            <div class="alert-banner warn">Preview only — no timetable or live data is being used.</div>
            <div class="board-body">
              ${pageRows.length ? renderTable(pageRows, cfg) : `<div class="empty-state"><div><strong>No route colours configured</strong><br><span>Add colours in Advanced settings to preview them here.</span></div></div>`}
            </div>
            <footer class="board-footer">
              <div class="legend"><span class="legend-swatch"></span>Configured route colours</div>
              <div class="ticker">Edit the palette in Advanced settings</div>
              <div class="clock">${clockLabel(state.now, cfg.timezone)}</div>
            </footer>
          </section>
        </main>`;
      document.querySelector("[data-action=previousDemo]")?.addEventListener("click", () => { state.page--; renderColorDemo(); });
      document.querySelector("[data-action=nextDemo]")?.addEventListener("click", () => { state.page++; renderColorDemo(); });
      document.querySelector("[data-action=setup]")?.addEventListener("click", () => { state.colorDemo = false; state.page = 0; render(); });
    }

    function renderTable(rows, cfg, options = {}) {
      const slots = options.slots || (cfg.dualStopMode ? cfg.pageSize : rows.length);
      const placeholders = options.slots ? Array.from({ length: Math.max(0, slots - rows.length) }, (_, index) => `<div class="dep-row placeholder-row"><span>${!rows.length && index === 0 ? escapeHtml(options.emptyLabel || "No departures") : "&nbsp;"}</span></div>`).join("") : "";
      const frequent = new Set(splitList(cfg.frequentRoutes).map(normLabel));
      const routeColors = parseRouteColors(cfg.routeColors);
      return `<div class="dep-table ${options.hideHeader ? "train-table" : ""}" style="--section-rows:${slots}">${options.hideHeader ? "" : `<div class="dep-head"><div>Route</div><div>Destination</div><div>Occupancy</div><div>Due</div></div>`}<div class="dep-rows" style="--row-count:${slots}">${rows.map(r => {
        // Blank frequent-routes list = every pill filled cyan; otherwise only listed routes are filled, the rest outlined (matches AT PID styling).
        const customColor = routeColors.get(normLabel(r.routeLabel));
        const pillClass = customColor || !frequent.size || frequent.has(normLabel(r.routeLabel)) ? "" : " outline";
        const pillStyle = customColor ? ` style="background:${customColor.background};color:${customColor.text};border-color:${customColor.background}"` : "";
        const cancelled = r.status === "cancelled";
        const middle = cancelled ? `<span class="badge cancelled">Cancelled</span>` : occupancyIcons(r.occupancy);
        // Live rows (a real prediction) show the moving countdown; rows with no ETA show
        // their fixed scheduled clock time — so a glance tells live from scheduled, the way
        // AT's PID boards do ("3 min" vs "23:15"). Cancelled rows keep their scheduled time.
        const due = (cancelled || r.status === "scheduled")
          ? timeLabel(r.scheduled, cfg.timezone)
          : formatDue(r.effective, state.now.getTime(), cfg);
        return `<div class="dep-row"><div><span class="route-pill${pillClass}"${pillStyle}>${escapeHtml(r.routeLabel)}</span></div><div><div class="dest-cell"><strong>${escapeHtml(normalizeDestinationLabel(r.destination))}</strong></div></div><div>${middle}</div><div class="due-cell">${due}</div></div>`;
      }).join("")}${placeholders}</div></div>`;
    }

    // A board built from an old GTFS zip is useless with today's realtime: AT rotates
    // trip ids every release, so nothing matches and every row silently degrades to the
    // stale schedule. Rebuild automatically from the configured GTFS URL when the bundle ages.
    const BUNDLE_MAX_AGE_MS = 3 * 24 * 3600000;
    let bundleRefreshAttempted = false;
    async function maybeRebuildStaleBundle() {
      if (bundleRefreshAttempted || !state.bundle) return;
      const builtAt = Date.parse(state.bundle.generatedAt || "") || 0;
      if (Date.now() - builtAt < BUNDLE_MAX_AGE_MS) return;
      bundleRefreshAttempted = true;
      console.info("[bundle] saved board is " + Math.round((Date.now() - builtAt) / 86400000) + " days old - refreshing from GTFS zip");
      if (await fetchGtfs({ quiet: true })) {
        await buildBundle({ open: false });
        if (state.config.mode === "board" && !state.colorDemo) render();
      }
      else console.warn("[bundle] automatic refresh failed - keeping the old board");
    }

    function autoLoadGtfs() {
      if (state.autoGtfsAttempted || state.gtfs) return;
      state.autoGtfsAttempted = true;
      fetchGtfs({ quiet: true }).then(ok => { if (ok && state.config.mode === "setup") renderSetup(); });
    }

    // Runtime
    function startRuntime() {
      clearTimers();
      // Tick just after each wall-clock second, not every 1000ms from whenever the board started.
      // A fixed interval's phase can sit right on a second boundary, so a tick running a few ms
      // late reads the next second and the display skips one; long tasks also push it later.
      const tick = () => {
        clockTimer = setTimeout(tick, 1020 - Date.now() % 1000);
        state.now = new Date();
        if (state.config.mode === "board") renderBoard();
      };
      clockTimer = setTimeout(tick, 1020 - Date.now() % 1000);
      timers.push(setInterval(() => { if (state.config.mode === "board" && !state.refreshing) refreshRealtime().then(() => { if (state.config.mode === "board" && !state.colorDemo) renderBoard(); }); }, Math.max(5, state.config.pollSeconds) * 1000));
      timers.push(setInterval(() => { if (state.config.mode === "board" && !state.pageLocked) { state.page++; renderBoard(); } }, Math.max(3, state.config.rotateSeconds) * 1000));
      refreshRealtime().then(() => { if (state.config.mode === "board") renderBoard(); });
    }

    function render() {
      clearTimers();
      if (state.colorDemo) {
        renderColorDemo();
        timers.push(setInterval(() => { state.page++; renderColorDemo(); }, Math.max(3, state.config.rotateSeconds) * 1000));
        return;
      }
      const keySet = Boolean(subscriptionKey(state.config));
      const keyOk = keySet || state.config.requireSubscriptionKey === false;
      if (state.config.mode === "board" && bundleHasSelectedStops() && keyOk && fourWayReady() && (!state.config.dualStopMode || dualStopIds().every(Boolean))) { renderBoard(); startRuntime(); maybeRebuildStaleBundle(); }
      else { state.config.mode = "setup"; renderSetup(); autoLoadGtfs(); }
    }

    window.addEventListener("error", e => { state.status = "Error: " + (e.message || "unknown"); try { render(); } catch {} });
    window.addEventListener("unhandledrejection", e => { state.status = "Error: " + (e.reason?.message || e.reason || "unknown"); try { render(); } catch {} });

    // Explicit allowlist: connection settings and credentials never enter shared URLs.
    const SHARED_BOARD_FIELDS = [
      "stopIds", "routeAllowlist", "frequentRoutes", "routeColors",
      "dualStopMode", "dualStopLeftId", "dualStopRightId", "dualStopLeftLabel", "dualStopRightLabel",
      "fourWayMode", "trainStationLabel", "trainLeftStopId", "trainRightStopId", "trainLeftRoutes", "trainRightRoutes",
      "pageSize", "rotateSeconds", "lookaheadHours", "relativeCutoffMinutes", "lockFirstPage", "chromeHidden"
    ];
    function sharedBoardPreferences(cfg) {
      return Object.fromEntries(SHARED_BOARD_FIELDS.map(key => [key, cfg[key] ?? DEFAULT_CONFIG[key]]));
    }
    function boardShareUrl() {
      const url = new URL(location.href);
      url.username = ""; url.password = "";
      url.search = "";
      const defaults = DEFAULT_CONFIG;
      const preferences = Object.fromEntries(Object.entries(sharedBoardPreferences(state.config)).filter(([key, value]) => key === "stopIds" || value !== defaults[key]));
      url.hash = "board=" + encodeURIComponent(JSON.stringify({ version: 1, source: "at", preferences }));
      return url.href;
    }
    function applySharedBoardLink() {
      if (!location.hash.startsWith("#board=")) return;
      try {
        if (location.hash.length > 32000) throw new Error("Link is too long");
        const data = JSON.parse(decodeURIComponent(location.hash.slice(7)));
        if (!data || data.version !== 1 || !["at", "motat"].includes(data.source) || !data.preferences || typeof data.preferences !== "object" || Array.isArray(data.preferences)) throw new Error("Unsupported board link");
        if (data.source !== "at") throw new Error("Open MOTAT links in index2.html");
        const prefs = {};
        for (const key of SHARED_BOARD_FIELDS) {
          const value = data.preferences[key];
          if (value === undefined) continue;
          const expected = typeof DEFAULT_CONFIG[key];
          if (typeof value !== expected || (expected === "number" && !Number.isFinite(value)) || (expected === "string" && value.length > 6000)) throw new Error("Invalid board preference");
          prefs[key] = value;
        }

        // Keep this browser's connection details. Shared links always open in setup for review/build.
        state.config = sanitizeConfig({ ...state.config, ...sharedBoardPreferences(DEFAULT_CONFIG), ...prefs, mode: "setup" });
        state.page = 0;
        state.pageLocked = Boolean(state.config.lockFirstPage);
        saveConfig();
        state.error = "";
        state.status = "Shared board preferences loaded. Review your stops, then build and open the board.";
        state.sharedLinkNotice = state.status;
      } catch (err) {
        state.config.mode = "setup";
        state.error = "Could not load this shared board link. " + (err.message || "Invalid link");
        state.sharedLinkNotice = state.error;
      }
      // Consume once so a reload does not undo later edits made in this browser.
      history.replaceState(null, "", location.pathname + location.search);
    }
    function openShareDialog() {
      if (state.config.mode === "setup") { readFormIntoConfig(); saveConfig(); }
      document.getElementById("share-board-dialog")?.remove();
      const dialog = document.createElement("dialog");
      dialog.id = "share-board-dialog";
      dialog.className = "share-dialog";
      dialog.setAttribute("aria-labelledby", "share-board-title");
      dialog.innerHTML = `<h2 id="share-board-title">Share board preferences</h2>
        <p>Includes stops, direction headings, bus and train service filters, colours and display layout. API keys, feed URLs and connection settings stay in this browser.</p>
        <label for="share-board-url">Board link</label><input id="share-board-url" type="text" readonly spellcheck="false">
        <p class="hint">The link opens with these preferences ready to review and build. Live data uses the recipient’s own connection settings.</p>
        <div class="share-dialog-actions"><button class="primary" data-copy-share>Copy link</button><button class="ghost" data-close-share>Close</button></div>
        <p class="hint" role="status" aria-live="polite" data-share-status></p>`;
      const input = dialog.querySelector("input");
      input.value = boardShareUrl();
      dialog.querySelector("[data-copy-share]").addEventListener("click", async () => {
        const status = dialog.querySelector("[data-share-status]");
        try {
          await navigator.clipboard.writeText(input.value);
          status.textContent = "Link copied.";
        } catch {
          input.focus(); input.select();
          status.textContent = "Copy the selected link with Ctrl+C or ⌘C.";
        }
      });
      dialog.querySelector("[data-close-share]").addEventListener("click", () => dialog.close());
      dialog.addEventListener("close", () => dialog.remove());
      document.body.append(dialog);
      dialog.showModal();
    }
    function wireShareButton() {
      document.querySelector("[data-action=shareBoard]")?.addEventListener("click", openShareDialog);
    }

    // Debug helpers exposed for console use.
    // Usage: dumpTrip("1033-32504-...") to inspect raw realtime data for a trip.
    //        dumpRows() to see every currently-rendered row with its predictedSource.
    window.dumpTrip = function (tripId) {
      const t = state.realtime && state.realtime.trips && state.realtime.trips[tripId];
      if (!t) { console.log("no realtime trip for", tripId); return null; }
      console.log("trip", tripId, "tripDelay:", t.tripDelay, "s, scheduleRel:", t.scheduleRelationship);
      console.table((t.orderedUpdates || []).map(u => ({
        seq: u.stopSequence, stopId: u.stopId, rel: u.scheduleRelationship,
        arrDelay: u.arrivalDelay, depDelay: u.departureDelay,
        arrTime: u.arrivalTime ? new Date(u.arrivalTime).toLocaleTimeString() : "",
        depTime: u.departureTime ? new Date(u.departureTime).toLocaleTimeString() : ""
      })));
      return t;
    };
    window.dumpRows = function () {
      const rows = deriveDepartures();
      console.table(rows.slice(0, 20).map(r => ({
        route: r.routeLabel, tripId: r.tripId, stopId: r.stopId,
        sched: new Date(r.scheduled).toLocaleTimeString(),
        pred: r.predicted ? new Date(r.predicted).toLocaleTimeString() : "",
        dueMin: Math.round((r.effective - state.now.getTime()) / 60000),
        deltaSec: r.predicted ? Math.round((r.predicted - r.scheduled) / 1000) : null,
        source: r.predictedSource || "scheduled-only", status: r.status
      })));
      return rows;
    };

    applySharedBoardLink();
    render();
  </script>
</body>
</html>
