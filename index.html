<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auckland Live Departures</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #142038;
      --surface: #1b2940;
      --surface2: #2b384b;
      --surface3: #36465f;
      --border: #4c5f79;
      --text: #eef8ff;
      --muted: #b9c8d8;
      --accent: #62ddf4;
      --accent-strong: #3ed2f1;
      --accent-text: #163047;
      --good: #62ddf4;
      --warn: #f1c666;
      --bad: #ee4ca4;
      --radius: 8px;
      font-family: "Open Sans", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100vh; }
    body {
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    button {
      font: inherit;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: .5rem .8rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, border-color .15s, background .15s;
    }
    button:hover { opacity: .88; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
    button.ghost { background: var(--surface2); color: var(--text); border-color: var(--border); }
    button.danger { background: transparent; color: #ffc8e4; border-color: var(--bad); }
    button.small { padding: .32rem .58rem; font-size: .82rem; }
    input, textarea, select {
      font: inherit;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      padding: .42rem .55rem;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--accent); }
    textarea { min-height: 3.1rem; resize: vertical; }
    textarea[name="routeColors"] { min-height: 14rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* Setup */
    .setup {
      max-width: 1180px;
      margin: 0 auto;
      padding: .75rem;
      font-size: .9rem;
    }
    .setup-header {
      margin-bottom: .45rem;
    }
    .setup-header h1 {
      font-size: 1.25rem;
      line-height: 1.15;
      margin-bottom: .15rem;
    }
    .setup-header p { color: var(--muted); font-size: .86rem; }
    .quick-actions {
      display: flex;
      gap: .4rem;
      margin: .45rem 0;
      flex-wrap: wrap;
    }
    .status-bar {
      padding: .42rem .55rem;
      color: var(--muted);
      font-size: .84rem;
      min-height: 1.9rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
    }
    .status-bar.error { color: #ffd0e9; border-color: var(--bad); background: rgba(238, 76, 164, .12); }
    .setup-layout {
      display: block;
    }
    /* Advanced section */
    .adv-group { border: 1px solid var(--border); border-radius: var(--radius); padding: .55rem .65rem; display: grid; gap: .45rem; background: rgba(255,255,255,.015); }
    .adv-head { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
    .adv-group h3 { margin: 0; font-size: .9rem; font-weight: 700; color: var(--text); }
    .adv-count { font-size: .75rem; font-weight: 400; color: var(--muted); margin-left: .35rem; }
    .adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .45rem; }
    .unit-input { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--surface2, transparent); overflow: hidden; }
    .unit-input input { border: 0 !important; margin: 0 !important; min-width: 0; flex: 1; background: transparent; }
    .unit-input span { padding: 0 .6rem; font-size: .78rem; color: var(--muted); white-space: nowrap; }
    .unit-input:focus-within { border-color: var(--accent); }
    .checkbox-label.plain { font-weight: 400 !important; font-size: .9rem; }
    .adv-group .four-way-settings { padding-bottom: 0; border-bottom: 0; margin-bottom: 0; }
    .adv-details > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: .6rem; }
    .adv-details > summary::-webkit-details-marker { display: none; }
    .adv-details > summary::before { content: "\25B6"; font-size: .65rem; color: var(--muted); transition: transform .2s; }
    .adv-details[open] > summary::before { transform: rotate(90deg); }
    .adv-details > summary .hint { margin: 0; }
    .adv-details-body { display: grid; gap: .45rem; margin-top: .45rem; }
    .adv-danger { display: flex; justify-content: space-between; align-items: center; gap: .8rem; border-color: rgba(255, 99, 132, .35); }
    .adv-danger .hint { margin-top: .1rem; }
    button.danger.confirming { background: #c0304a; color: #fff; }
    .adv-group textarea[name=routeColors] { min-height: 0; height: 7.2rem; resize: vertical; }
    /* Stop-level notices from AT take over the footer and scroll, like AT's own boards. */
    .board-footer.notice .legend,
    .board-footer.notice .mode-indicator { display: none; }
    .board-footer.notice .ticker { text-align: left; text-overflow: clip; font-weight: 700; }
    /* Soft fade where the message meets the clock (and as it enters), like AT's boards. */
    .board-footer.notice .ticker {
      -webkit-mask-image: linear-gradient(to right, transparent 0, #000 2rem, #000 calc(100% - 5rem), transparent 100%);
      mask-image: linear-gradient(to right, transparent 0, #000 2rem, #000 calc(100% - 5rem), transparent 100%);
    }
    .board-footer.notice-high { background: #e6007e; border-color: #ff4fb0; }
    .board-footer.notice-high .ticker,
    .board-footer.notice-high .clock { color: #fff; }
    .board-footer.notice-low { background: #f4f7fa; border-color: #ffffff; }
    .board-footer.notice-low .ticker,
    .board-footer.notice-low .clock { color: #142033; }
    .board-shell.frameless .board-footer.notice-high { background: #e6007e; }
    .board-shell.frameless .board-footer.notice-low { background: #f4f7fa; }
    .marquee { display: inline-block; padding-left: 100%; white-space: nowrap; animation: marquee linear infinite; will-change: transform; }
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }
    @media (prefers-reduced-motion: reduce) {
      .marquee { animation: none; padding-left: 0; }
      .board-footer.notice .ticker { text-overflow: ellipsis; }
    }
    .debug-grid {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      margin: .45rem 0;
    }
    .debug-item {
      display: inline-flex;
      gap: .35rem;
      padding: .28rem .45rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--muted);
      font-size: .78rem;
    }
    .debug-item strong { color: var(--text); font-weight: 800; text-align: right; }
    .note {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--muted);
      font-size: .8rem;
      padding: .4rem .5rem;
    }
    .link-row {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .link-button {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .32rem .58rem;
      color: var(--text);
      font-size: .82rem;
      font-weight: 600;
      text-decoration: none;
      background: var(--surface2);
    }
    .link-button:hover { border-color: var(--accent); color: var(--text); }
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: .45rem;
      overflow: hidden;
    }
    .section-header {
      padding: .36rem .5rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .section-header:hover { background: var(--surface2); }
    .section-header .arrow { transition: transform .2s; font-size: .8rem; color: var(--muted); }
    .section-header .arrow.open { transform: rotate(90deg); }
    .section-status { font-size: .75rem; font-weight: 400; color: var(--muted); margin-left: .45rem; }
    .section-body {
      padding: 0 .5rem .45rem;
      display: grid;
      gap: .42rem;
    }
    .section-body.hidden { display: none; }
    .field label {
      display: block;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: .25rem;
      font-weight: 400;
    }
    .hint {
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.35;
      margin-top: .22rem;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: .45rem; }
    .stop-results {
      max-height: 10rem;
      overflow-y: auto;
      display: grid;
      gap: .4rem;
    }
    .stop-item {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .38rem .48rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: .85rem;
    }
    .stop-item .name { flex: 1; font-weight: 600; }
    .stop-item .id { color: var(--muted); font-size: .78rem; }
    .step {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .55rem .65rem;
      margin-bottom: .45rem;
      display: grid;
      gap: .45rem;
    }
    .step h2 { font-size: .98rem; font-weight: 700; }
    .step-status { font-size: .75rem; font-weight: 400; color: var(--muted); margin-left: .4rem; }
    .ok { color: var(--good); }
    .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
    .checkbox-label { display: inline-flex !important; align-items: center; gap: .5rem; cursor: pointer; color: var(--text) !important; font-weight: 700 !important; }
    .checkbox-label input { width: auto; margin: 0; }
    .dual-stop-settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .65rem; }
    .dual-stop-settings input { margin-top: .4rem; }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: .15rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: .2rem .25rem .2rem .6rem;
      font-size: .82rem;
      font-weight: 600;
    }
    .chip .chip-id { color: var(--muted); font-weight: 400; font-size: .74rem; margin-left: .3rem; }
    .chip button { padding: 0 .45rem; background: transparent; border: none; color: var(--muted); font-size: .95rem; line-height: 1.3; }
    .chip button:hover { color: #ffd0e9; opacity: 1; }
    .cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem; margin: .55rem 0; }
    .cta-row .primary { font-size: 1.02rem; padding: .62rem 1.2rem; }

    /* Connect strip (timetable + API key) */
    .connect { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin: .5rem 0; }
    .connect-pill {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      padding: .5rem .6rem;
      display: grid;
      gap: .4rem;
      align-content: start;
    }
    .connect-pill.done { background: rgba(98, 221, 244, .08); border-color: rgba(98, 221, 244, .4); }
    .connect-pill.bad { background: rgba(238, 76, 164, .1); border-color: var(--bad); }
    .pill-head { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .pill-title { font-weight: 700; font-size: .86rem; }
    .pill-title .req {
      font-weight: 600; font-size: .64rem; text-transform: uppercase; letter-spacing: .04em;
      color: #ffd0e9; border: 1px solid rgba(238, 76, 164, .5); border-radius: 999px;
      padding: .02rem .34rem; margin-left: .35rem; vertical-align: middle;
    }
    .pill-state { font-size: .76rem; color: var(--muted); white-space: nowrap; }
    .pill-state.ok { color: var(--good); font-weight: 700; }
    .pill-state.bad { color: #ffd0e9; font-weight: 700; }
    .pill-sub { font-size: .75rem; color: var(--muted); }
    .pill-sub a { color: var(--accent); }
    .pill-actions { display: flex; gap: .4rem; align-items: center; }
    .pill-actions input[name=subscriptionKey] { flex: 1; }
    .pill-actions .link-button, .pill-actions button { flex: none; }
    .timetable-loader {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-content: center;
      gap: .55rem;
      text-align: center;
      background: linear-gradient(110deg, rgba(24, 33, 48, .96), rgba(31, 47, 64, .96));
      color: var(--text);
    }
    .loader-track {
      position: relative;
      width: min(15rem, 70vw);
      height: 2.2rem;
      overflow: hidden;
    }
    .loader-track::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: .28rem;
      height: 2px;
      background: repeating-linear-gradient(90deg, rgba(98,221,244,.25) 0 12px, transparent 12px 20px);
    }
    .loader-bus {
      position: absolute;
      left: 0;
      bottom: .42rem;
      width: 3.3rem;
      height: 1.45rem;
      border-radius: .45rem .55rem .25rem .25rem;
      background: linear-gradient(180deg, #73e8fa, #36bdd8);
      box-shadow: 0 0 18px rgba(98,221,244,.35);
      animation: timetable-trip 2.4s ease-in-out infinite;
    }
    .loader-bus::before {
      content: "";
      position: absolute;
      inset: .25rem .32rem .55rem;
      border-radius: .15rem;
      background: repeating-linear-gradient(90deg, #20324a 0 .58rem, transparent .58rem .72rem);
    }
    .loader-bus::after {
      content: "";
      position: absolute;
      left: .45rem;
      right: .45rem;
      bottom: -.2rem;
      height: .42rem;
      background: radial-gradient(circle at .2rem .2rem, #101824 0 .2rem, transparent .21rem), radial-gradient(circle at calc(100% - .2rem) .2rem, #101824 0 .2rem, transparent .21rem);
    }
    .loader-copy { font-size: .8rem; font-weight: 700; letter-spacing: .02em; }
    .loader-copy span::after { content: ""; animation: loading-dots 1.4s steps(4, end) infinite; }
    @keyframes timetable-trip {
      0% { transform: translateX(-3.5rem); opacity: 0; }
      15%, 85% { opacity: 1; }
      100% { transform: translateX(15rem); opacity: 0; }
    }
    @keyframes loading-dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader-bus { animation: none; left: calc(50% - 1.65rem); }
      .loader-copy span::after { animation: none; content: "..."; }
    }
    input.key-bad { border-color: var(--bad); }
    .mode-explainer {
      display: flex;
      align-items: flex-start;
      gap: .55rem;
      margin: -.05rem 0 .55rem;
      padding: .55rem .65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.35;
    }
    .mode-explainer strong { color: var(--text); white-space: nowrap; }
    .preset-bar {
      display: grid;
      grid-template-columns: auto minmax(10rem, 14rem) minmax(0, 1fr);
      align-items: center;
      gap: .55rem;
      margin: 0 0 .55rem;
      padding: .5rem .65rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .preset-bar label { font-size: .82rem; font-weight: 700; color: var(--text); }
    .preset-bar select { padding: .42rem .55rem; }
    .preset-summary { min-width: 0; color: var(--muted); font-size: .75rem; line-height: 1.3; }
    .mode-dot {
      width: .62rem;
      height: .62rem;
      margin-top: .22rem;
      border-radius: 999px;
      background: var(--muted);
      flex: none;
    }
    .mode-dot.full { background: var(--good); }
    .mode-dot.limited { background: var(--warn); }
    .mode-dot.degraded, .mode-dot.scheduled { background: var(--bad); }
    button.linkish {
      background: none; border: none; padding: 0; color: var(--accent);
      font-size: inherit; font-weight: 600; text-decoration: underline; cursor: pointer;
    }
    button.linkish:hover { opacity: .85; }

    /* Focused step + stop result meta + inline preview */
    .step.focus { border-color: rgba(98, 221, 244, .45); box-shadow: inset 0 0 0 1px rgba(98, 221, 244, .12); }
    .stop-item .name { flex: 1; font-weight: 600; display: flex; flex-direction: column; }
    .stop-item .name .meta { font-weight: 400; color: var(--muted); font-size: .72rem; }
    .preview { border: 1px dashed var(--border); border-radius: var(--radius); padding: .45rem .55rem; display: grid; gap: .35rem; background: var(--surface); }
    .preview-title { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .preview-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .55rem; font-size: .92rem; }
    .preview-row .pv-pill {
      display: inline-flex; justify-content: center; align-items: center;
      min-width: 2.7rem; height: 1.55rem; padding: 0 .42rem; border-radius: 6px;
      background: linear-gradient(180deg, #73e8fa 0%, #57d9f2 100%);
      color: var(--accent-text); font-weight: 700; font-size: .85rem;
    }
    .preview-row .pv-due { font-weight: 700; white-space: nowrap; }
    .preview-empty { font-size: .78rem; color: var(--muted); }
    @media (max-width: 700px) {
      .connect { grid-template-columns: 1fr; }
      .preset-bar { grid-template-columns: 1fr; }
    }

    /* Board */
    .board {
      min-height: 100vh;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .board.frameless {
      padding: 0;
    }
    .chrome-toggle {
      position: absolute;
      top: .2rem;
      right: .25rem;
      z-index: 20;
      min-width: 1.6rem;
      min-height: 1.6rem;
      padding: 0;
      border-radius: 999px;
      background: rgba(43, 56, 75, .9);
      border-color: rgba(185, 200, 216, .28);
      color: #d9ecf7;
      font-size: .72rem;
      line-height: 1;
    }
    .chrome-toggle:hover {
      background: rgba(54, 70, 95, .95);
      border-color: rgba(98, 221, 244, .45);
    }
    .board.frameless .chrome-toggle {
      top: .18rem;
      right: .18rem;
      opacity: .1;
      background: transparent;
      border-color: transparent;
      color: #f0fbff;
    }
    .board.frameless .chrome-toggle:hover {
      opacity: .45;
      background: rgba(43, 56, 75, .55);
      border-color: rgba(185, 200, 216, .18);
    }
    .board-shell {
      flex: 1;
      background: var(--surface2);
      border: 1px solid #41516a;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      min-height: 0;
      gap: .6rem;
      padding: .7rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
    }
    .board-shell.frameless {
      background: transparent;
      border-color: transparent;
      box-shadow: none;
      padding: 0;
      gap: 0;
    }
    .board-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: .2rem .2rem .1rem;
    }
    .board-header h1 {
      font-size: clamp(1.6rem, 3.5vw, 3rem);
      line-height: 1.1;
      font-weight: 700;
    }
    .board-header .sub { color: var(--muted); font-size: .9rem; }
    .board-meta {
      text-align: right;
      font-size: .9rem;
      color: #d9ecf7;
      display: flex;
      flex-direction: column;
      gap: .3rem;
      align-items: flex-end;
      width: 100%;
    }
    .board-meta-top {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .7rem;
      width: 100%;
    }
    .share-dialog {
      margin: auto;
      width: min(36rem, calc(100vw - 2rem));
      padding: 1.4rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1rem 4rem #0008;
    }
    .share-dialog::backdrop { background: #0009; }
    .shared-board-notice { color: var(--accent); font-size: .9rem; margin: .5rem 0; }
    .share-dialog p { margin: .7rem 0; }
    .share-dialog input { width: 100%; margin-top: .35rem; }
    .share-dialog-actions { display: flex; gap: .5rem; margin-top: 1rem; }
    .board-controls {
      display: flex;
      gap: .3rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .board-shell.frameless .board-header {
      display: none;
    }
    .board-shell.frameless .board-controls {
      display: none;
    }
    .board-shell.frameless .board-meta-top {
      display: none;
    }
    .board-shell.frameless .alert-banner {
      display: none;
    }
    .board-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    /* Scale every dual-board column from the same unit as the CSS viewport narrows at page zoom. */
    .dual-mode { --dual-unit: clamp(.625rem, 1.25vw, 1rem); }
    .dual-mode.board:not(.frameless) { padding: calc(.5 * var(--dual-unit)); }
    .dual-mode .board-shell:not(.frameless) { padding: calc(.4 * var(--dual-unit)); gap: calc(.35 * var(--dual-unit)); }
    /* Dual mode: the top bar is controls only. Status lives in the footer pill and page
       numbers in each column header, so the meta line would just repeat them. */

</head>
<body>
  <div id="app"></div>
  <script>
    const STORE_KEY = "akl-pid-v2";
    // Credential embedded in AT's live-departures web page. It provides limited per-stop
    // predictions without a personal key, but does not replace the comprehensive GTFS-RT
    // feeds. Kept as a fallback if config migration removes departuresKey.
    const DEPARTURES_KEY = "0526f69dcb074a4b8df741eef46121fc";
    const DEFAULT_GTFS_URL = "https://raw.githubusercontent.com/justinhu-nz/auckland-gtfs/refs/heads/main/gtfs.zip";
    // Same feed as plain .txt files, for browsers without DecompressionStream (older Safari/Firefox).
    // Any GTFS URL ending in "/" is treated as a folder of unpacked files.
    const DEFAULT_GTFS_UNPACKED_URL = "https://raw.githubusercontent.com/justinhu-nz/auckland-gtfs/refs/heads/main/gtfs/";
    const LEGACY_GTFS_URLS = new Set([
      "https://gtfs.at.govt.nz/gtfs.zip",
      "https://github.com/justinhu-nz/auckland-gtfs/raw/refs/heads/main/gtfs.zip",
      "gtfs.zip",
      "gtfs (1).zip"
    ]);
    const DEFAULT_ROUTE_COLORS = `BAYS: #4FAFBD / #000000
BIRK: #4FAFBD / #000000
DEV: #4FAFBD / #000000
GULF: #4FAFBD / #000000
HMB: #4FAFBD / #000000
HOBS: #4FAFBD / #000000
MTIA: #4FAFBD / #000000
MTID: #4FAFBD / #000000
PINE: #4FAFBD / #000000
RAK: #4FAFBD / #000000
WSTH: #4FAFBD / #000000
INN: #6CB655 / #000000
OUT: #E99C3F / #000000
AIR: #E99C3F / #000000
CTY: #D9322A / #FFFFFF
TMK: #3278B8 / #FFFFFF
E-W: #A3C850 / #000000
O-W: #4BAEE8 / #000000
S-C: #D03A2E / #FFFFFF
NX1: #23408B / #FFFFFF
NX2: #4AA5B5 / #FFFFFF
WX1: #3E8C52 / #FFFFFF`;
    const PREVIOUS_DEFAULT_ROUTE_COLORS = `BAYS: #1BE2F1 / #1F2A44
BIRK: #1BE2F1 / #1F2A44
DEV: #1BE2F1 / #1F2A44
GULF: #1BE2F1 / #1F2A44
HMB: #1BE2F1 / #1F2A44
HOBS: #1BE2F1 / #1F2A44
MTIA: #1BE2F1 / #1F2A44
MTID: #1BE2F1 / #1F2A44
PINE: #1BE2F1 / #1F2A44
RAK: #1BE2F1 / #1F2A44
WSTH: #1BE2F1 / #1F2A44
INN: #6CB655 / #FFFFFF
OUT: #E99C3F / #FFFFFF
AIR: #E99C3F / #1F2A44
CTY: #D9322A / #FFFFFF
TMK: #3278B8 / #FFFFFF
E-W: #A3C850 / #1F2A44
O-W: #4BAEE8 / #1F2A44
S-C: #D03A2E / #FFFFFF`;
    const LEGACY_DEFAULT_ROUTE_COLORS = new Set([
      PREVIOUS_DEFAULT_ROUTE_COLORS,
      PREVIOUS_DEFAULT_ROUTE_COLORS.replace("AIR: #E99C3F / #1F2A44", "AIR: #E99C3F / #FFFFFF")
    ]);
    const PRESETS = {
      "at-default": {
        label: "AT Default",
        summary: "10s refresh · 5 rows · 5s page rotation · 2h lookahead · AT cyan route pills",
        config: {
          pollSeconds: 10,
          pageSize: 5,
          rotateSeconds: 5,
          lookaheadHours: 2,
          frequentRoutes: ""
        }
      }
    };
    // Filled in at deploy time from the AT_API_KEY GitHub secret (see .github/workflows/deploy.yml).
    const BUILTIN_AT_KEY = "__AT_API_KEY__";
    const HAS_BUILTIN_KEY = !BUILTIN_AT_KEY.startsWith("__");
    function subscriptionKey(cfg) {
      const personal = String(cfg.subscriptionKey || "").trim();
      return personal || (HAS_BUILTIN_KEY ? BUILTIN_AT_KEY : "");
    }
    const DEFAULT_CONFIG = {
      timezone: "Pacific/Auckland",
      gtfsUrl: DEFAULT_GTFS_URL,
      realtimeUrl: "https://api.at.govt.nz/realtime/legacy/tripupdates",
      alertsUrl: "https://api.at.govt.nz/realtime/legacy/servicealerts",
      vehiclesUrl: "https://api.at.govt.nz/realtime/legacy/vehiclelocations",
      departuresUrl: "https://api.at.govt.nz/serviceinfo/v1/departures",
      departuresKey: DEPARTURES_KEY,
      frequentRoutes: "",
      routeColors: DEFAULT_ROUTE_COLORS,
      subscriptionKey: "",
      pollSeconds: 10,
      pageSize: 5,
      rotateSeconds: 5,
      lockFirstPage: false,
      requireSubscriptionKey: true,
      lookaheadHours: 2,
      relativeCutoffMinutes: 60,
      staleMultiplier: 2,
      routeAllowlist: "",
      stopIds: "8205-eda192d2",
      dualStopMode: false,
      dualStopLeftId: "",
      dualStopRightId: "",
      dualStopLeftLabel: "",
      dualStopRightLabel: "",
      fourWayMode: false,
      trainStationLabel: "",
      trainLeftStopId: "",
      trainRightStopId: "",
      trainLeftRoutes: "",
      trainRightRoutes: "",
      chromeHidden: false,
      mode: "setup"
    };

    const state = {
      config: loadConfig(),
      bundle: loadBundle(),
      gtfs: null,
      realtime: loadRealtime(),
      status: "",
      error: "",
      realtimeStatus: "",
      now: new Date(),
      page: 0,
      stopSearch: "",
      autoGtfsAttempted: false,
      gtfsLoading: false,
      colorDemo: false,
      pageLocked: false,
      refreshing: false,
      refreshFailed: false,
      keyTest: null, // null | "testing" | "ok" | "fail"
      expandedSections: { advanced: false },
      pickers: {},
      building: false
    };
    let timers = [];
    let clockTimer = null;
    let realtimeRequestSeq = 0;
    let bundleBuildSeq = 0;
    let gtfsLoadSeq = 0;
    state.pageLocked = Boolean(state.config.lockFirstPage);

    function loadConfig() {
      const stored = loadJson("config");
      const saved = stored && typeof stored === "object" && !Array.isArray(stored) ? stored : {};
      if (saved.demoMode || String(saved.stopIds || "").includes("demo-")) return Object.assign({}, DEFAULT_CONFIG);
      delete saved.demoMode;
      if (LEGACY_DEFAULT_ROUTE_COLORS.has(saved.routeColors)) delete saved.routeColors;
      if (LEGACY_GTFS_URLS.has(saved.gtfsUrl)) delete saved.gtfsUrl;
      if (!saved.realtimeUrl) delete saved.realtimeUrl;
      if (!saved.alertsUrl) delete saved.alertsUrl;
      if (!saved.vehiclesUrl) delete saved.vehiclesUrl;
      if (!saved.departuresUrl) delete saved.departuresUrl;
      if (!saved.departuresKey) delete saved.departuresKey;
      // Old default was 20; migrate to the new 60 (matches the AT website, which shows
      // "45 min" rather than switching to clock time). Explicit other values are kept.
      if (saved.relativeCutoffMinutes === 20) delete saved.relativeCutoffMinutes;
      return sanitizeConfig(Object.assign({}, DEFAULT_CONFIG, saved));
    }
    function loadBundle() {
      const bundle = loadJson("bundle");
      const maps = ["stops", "routes", "trips", "calendars", "calendarDates", "stopTimesByStop"];
      return bundle && bundle.source !== "demo" && maps.every(key => bundle[key] && typeof bundle[key] === "object" && !Array.isArray(bundle[key])) &&
        Object.values(bundle.stopTimesByStop).every(rows => Array.isArray(rows) && rows.every(row => row && typeof row === "object")) &&
        Object.values(bundle.calendarDates).every(rows => Array.isArray(rows) && rows.every(row => row && typeof row === "object" && typeof row.date === "string")) ? bundle : null;
    }
    function loadRealtime() {
      const realtime = loadJson("realtime");
      return realtime && realtime.sourceUrl !== "demo://local" &&
        ["trips", "vehicles"].every(key => realtime[key] && typeof realtime[key] === "object" && !Array.isArray(realtime[key])) &&
        (realtime.notices === undefined || (Array.isArray(realtime.notices) && realtime.notices.every(notice => notice && typeof notice.text === "string"))) &&
        Object.values(realtime.trips).every(trip => trip && typeof trip === "object" && trip.updates && typeof trip.updates === "object" &&
          (!trip.orderedUpdates || (Array.isArray(trip.orderedUpdates) && trip.orderedUpdates.every(update => update && typeof update === "object")))) &&
        Array.isArray(realtime.alerts) && realtime.alerts.every(alert => alert && typeof alert === "object" &&
          Array.isArray(alert.stopIds) && Array.isArray(alert.routeIds)) ? realtime : null;
    }
    function loadJson(name) {
      try {
        const raw = localStorage.getItem(STORE_KEY + ":" + name);
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    }
    function saveJson(name, value) {
      try { localStorage.setItem(STORE_KEY + ":" + name, JSON.stringify(value)); }
      catch { state.status = "Storage unavailable — settings will not persist."; }
    }
    function clearTimers() { timers.forEach(clearInterval); timers = []; clearTimeout(clockTimer); }
    function splitList(text) {
      return String(text || "").split(/[,\n]/).map(v => v.trim()).filter(Boolean);
    }
    function dualStopIds(cfg = state.config) {
      const stops = Array.from(new Set(splitList(cfg.stopIds)));
      const left = stops.includes(cfg.dualStopLeftId) ? cfg.dualStopLeftId : stops[0];
      const right = stops.includes(cfg.dualStopRightId) && cfg.dualStopRightId !== left
        ? cfg.dualStopRightId : stops.find(id => id !== left);
      return [left, right];
    }
    function fourWayEnabled(cfg = state.config) {
      return Boolean(cfg.dualStopMode && cfg.fourWayMode);
    }
    function trainPlatformIds(cfg = state.config) {
      return [cfg.trainLeftStopId, cfg.trainRightStopId].map(id => String(id || "").trim());
    }
    function boardStopIds(cfg = state.config) {
      const buses = cfg.dualStopMode ? dualStopIds(cfg) : splitList(cfg.stopIds);
      return Array.from(new Set([...buses, ...(fourWayEnabled(cfg) ? trainPlatformIds(cfg) : [])]));
    }
    function trainRoutesMatch(route, filters) {
      const allowed = new Set(splitList(filters).map(normLabel));
      return !allowed.size || [route.shortName, route.longName, route.routeId].some(label => allowed.has(normLabel(label)));
    }
    function fourWayReady(cfg = state.config) {
      return !fourWayEnabled(cfg) || trainPlatformIds(cfg).every(Boolean);
    }
    function renderFourWaySettings(cfg) {
      const stops = state.gtfs ? state.gtfs.stops : Object.values(state.bundle?.stops || {}).map(s => ({ stop_id: s.stopId, stop_name: s.name, platform_code: s.platformCode }));
      return `<div class="four-way-settings">
        <label class="checkbox-label plain"><input name="fourWayMode" type="checkbox" ${cfg.fourWayMode ? "checked" : ""}> Show trains under each side (dual-stop mode)</label>
        <p class="hint">In dual-stop mode, reserve the bottom two rows on each side for trains. Bus pages rotate above; trains always show the next two departures for that side’s platform. Rows per page includes the two train rows (minimum 3).</p>
        ${cfg.fourWayMode ? `<div class="field"><label for="train-station-label">Thin station heading</label><input id="train-station-label" name="trainStationLabel" value="${escapeHtml(cfg.trainStationLabel)}" placeholder="e.g. Henderson Station"><div class="hint">Blank uses the platform’s stop name.</div></div>
        <datalist id="train-platforms">${stops.filter(s => !s.location_type || s.location_type === "0").map(s => `<option value="${escapeHtml(s.stop_id)}">${escapeHtml(s.stop_name)}${s.platform_code ? " · Platform " + escapeHtml(s.platform_code) : ""} · ${escapeHtml(s.stop_code || s.stop_id.split("-")[0])}</option>`).join("")}</datalist>
        <div class="row">${["Left", "Right"].map(side => `<div class="field"><label for="train-${side}-platform">${side} train platform</label><input id="train-${side}-platform" name="train${side}StopId" list="train-platforms" value="${escapeHtml(cfg['train' + side + 'StopId'])}" placeholder="Search station/platform or paste stop ID"><label for="train-${side}-routes">${side} train services</label><input id="train-${side}-routes" name="train${side}Routes" value="${escapeHtml(cfg['train' + side + 'Routes'])}" placeholder="All train services"><div class="hint">Comma-separated route names or IDs from the timetable. Blank includes every train service at this platform.</div></div>`).join("")}</div>
        <p class="hint">Choose the individual platform stop for each direction, then rebuild the board. Train services have their own filters; the bus route filter does not affect them.</p>` : ""}
      </div>`;
    }

    function bundleHasSelectedStops(cfg = state.config) {
      if (!state.bundle) return false;
      const ids = boardStopIds(cfg);
      // Older saved bundles did not retain route types; rebuild before using them for trains.
      if (fourWayEnabled(cfg) && !trainPlatformIds(cfg).every(id => (state.bundle.stopTimesByStop?.[id] || []).some(st => Number(state.bundle.routes[st.routeId]?.type) === 2))) return false;
      return ids.every(id => Boolean(state.bundle.stops && state.bundle.stops[id]));
    }
    function gtfsRtArray(value) {
      if (!value) return [];
      if (Array.isArray(value)) return value;
      if (typeof value !== "object") return [];
      const singleKeys = ["trip_update", "tripUpdate", "vehicle", "alert", "stop_sequence", "stopSequence", "stop_id", "stopId", "arrival", "departure", "route_id", "routeId"];
      return singleKeys.some(k => k in value) ? [value] : Object.values(value);
    }
    function normLabel(value) {
      return String(value || "").trim().toLowerCase();
    }
    function clampNumber(value, fallback, min, max) {
      const n = Number(value);
      if (!Number.isFinite(n)) return fallback;
      return Math.min(max, Math.max(min, n));
    }
    function safeTimezone(value) {
      const tz = String(value || DEFAULT_CONFIG.timezone).trim();
      try {
        new Intl.DateTimeFormat("en-NZ", { timeZone: tz }).format(new Date());
        return tz;
      } catch { return DEFAULT_CONFIG.timezone; }
    }
    function sanitizeConfig(cfg) {
      // Migrate keys copied into settings by the old Auto button.
      if (HAS_BUILTIN_KEY && cfg.subscriptionKey === BUILTIN_AT_KEY) cfg.subscriptionKey = "";
      // Saved browser data can be valid JSON with invalid field types.
      for (const [key, fallback] of Object.entries(DEFAULT_CONFIG)) {
        if (typeof fallback === "string" && typeof cfg[key] !== "string") cfg[key] = fallback;
        if (typeof fallback === "boolean" && typeof cfg[key] !== "boolean") cfg[key] = fallback;
      }
      cfg.timezone = safeTimezone(cfg.timezone);
      cfg.pollSeconds = clampNumber(cfg.pollSeconds, DEFAULT_CONFIG.pollSeconds, 5, 3600);
      cfg.pageSize = Math.round(clampNumber(cfg.pageSize, DEFAULT_CONFIG.pageSize, 1, 50));
      cfg.rotateSeconds = clampNumber(cfg.rotateSeconds, DEFAULT_CONFIG.rotateSeconds, 3, 3600);
      cfg.lookaheadHours = clampNumber(cfg.lookaheadHours, DEFAULT_CONFIG.lookaheadHours, 1, 48);
      cfg.relativeCutoffMinutes = clampNumber(cfg.relativeCutoffMinutes, DEFAULT_CONFIG.relativeCutoffMinutes, 0, 180);
      cfg.staleMultiplier = clampNumber(cfg.staleMultiplier, DEFAULT_CONFIG.staleMultiplier, 1, 20);
      return cfg;
    }
    function matchingPresetId(cfg) {
      for (const [id, preset] of Object.entries(PRESETS)) {
        const matches = Object.entries(preset.config).every(([key, value]) => {
          return typeof value === "number" ? Number(cfg[key]) === value : String(cfg[key] ?? "") === String(value);
        });
        if (matches) return id;
      }
      return "";
    }
    function escapeHtml(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    }
    function safeHref(value) {
      try {
        const url = new URL(String(value || ""), location.href);
        return /^(https?|file):$/.test(url.protocol) ? url.href : "#";
      } catch { return "#"; }
    }
    function gtfsFetchCandidates(primary = state.config.gtfsUrl) {
      const values = [primary, DEFAULT_GTFS_URL, DEFAULT_GTFS_UNPACKED_URL]
        .map(v => String(v || "").trim())
        .filter(Boolean);
      return Array.from(new Set(values));
    }
    function isUnpackedGtfsUrl(url) {
      return /\/$/.test(String(url).split(/[?#]/)[0]);
    }

    // CSV parser
    function csvParse(text) {
      const rows = [];
      let row = [], field = "", quoted = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i], n = text[i + 1];
        if (quoted) {
          if (c === '"' && n === '"') { field += '"'; i++; }
          else if (c === '"') quoted = false;
          else field += c;
        } else if (c === '"') quoted = true;
        else if (c === ",") { row.push(field); field = ""; }
        else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (c !== "\r") field += c;
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      const header = (rows.shift() || []).map(h => h.replace(/^\uFEFF/, ""));
      return rows.filter(r => r.length && r.some(Boolean)).map(r => Object.fromEntries(header.map((h, i) => [h, r[i] || ""])));
    }

    // ZIP reader
    async function readZipEntries(buffer, names) {
      if (!("DecompressionStream" in globalThis)) throw new Error("Browser needs DecompressionStream (Chrome/Edge).");
      const bytes = new Uint8Array(buffer);
      const view = new DataView(buffer);
      let eocd = -1;
      for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--) {
        if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
      }
      if (eocd < 0) throw new Error("Invalid ZIP file.");
      const entryCount = view.getUint16(eocd + 10, true);
      let cdOffset = view.getUint32(eocd + 16, true);
      const wanted = new Set(names);
      const output = {};
      for (let e = 0; e < entryCount; e++) {
        if (view.getUint32(cdOffset, true) !== 0x02014b50) throw new Error("Invalid ZIP entry.");
        const method = view.getUint16(cdOffset + 10, true);
        const compressedSize = view.getUint32(cdOffset + 20, true);
        const nameLen = view.getUint16(cdOffset + 28, true);
        const extraLen = view.getUint16(cdOffset + 30, true);
        const commentLen = view.getUint16(cdOffset + 32, true);
        const localOffset = view.getUint32(cdOffset + 42, true);
        const name = new TextDecoder().decode(bytes.slice(cdOffset + 46, cdOffset + 46 + nameLen));
        if (wanted.has(name)) {
          const localNameLen = view.getUint16(localOffset + 26, true);
          const localExtraLen = view.getUint16(localOffset + 28, true);
          const start = localOffset + 30 + localNameLen + localExtraLen;
          const compressed = bytes.slice(start, start + compressedSize);
          let fileBytes;
          if (method === 0) fileBytes = compressed;
          else if (method === 8) fileBytes = new Uint8Array(await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
          else throw new Error("Unsupported ZIP method " + method);
          output[name] = new TextDecoder("utf-8").decode(fileBytes);
        }
        cdOffset += 46 + nameLen + extraLen + commentLen;
      }
      return output;
    }

    // Unpacked reader: same output as readZipEntries, but fetches each .txt from a folder URL
    // (baseUrl must be absolute, since this also runs inside the worker). Missing optional
    // files are skipped, like absent zip entries.
    async function readUnpackedEntries(baseUrl, names) {
      const output = {};
      await Promise.all(names.map(async name => {
        const res = await fetch(new URL(name, baseUrl).href);
        if (res.ok) output[name] = await res.text();
        else if (res.status !== 404) throw new Error(name + " fetch failed: " + res.status);
      }));
      return output;
    }

    // A loaded feed is either { buffer } (zip) or { baseUrl } (unpacked folder).
    function readGtfsEntries(feed, names) {
      return feed.buffer ? readZipEntries(feed.buffer, names) : readUnpackedEntries(feed.baseUrl, names);
    }
    function gtfsWorkerFeed(feed) {
      return feed.buffer ? { buffer: feed.buffer.slice(0) } : { baseUrl: feed.baseUrl };
    }

    // GTFS ingestion. stop_times.txt in a full AT feed is ~80 MB / 1.7M rows; parsing it
    // all into objects froze the page for minutes. Instead, work happens in an inline
    // Web Worker, and stop_times is never fully parsed: the worker scans it line by line
    // and returns only the rows for the configured stops (a few hundred).
    function stopTimesFilterSource() {
      // Serialized into the worker. NL/CR constants avoid template-escaping mistakes.
      return `
        const NL = String.fromCharCode(10), CR = String.fromCharCode(13);
        function filterStopTimes(text, stopIds) {
          const want = new Set(stopIds);
          const headEnd = text.indexOf(NL);
          const headerLine = text.slice(0, headEnd < 0 ? text.length : headEnd).split(CR).join("").replace(/^\\uFEFF/, "");
          if (headEnd < 0) return [];
          const header = headerLine.split(",").map(h => h.replace(/^"|"$/g, ""));
          const stopCol = header.indexOf("stop_id");
          if (stopCol < 0) throw new Error("stop_times.txt missing stop_id column");
          const rows = [];
          let pos = headEnd + 1;
          while (pos < text.length) {
            let end = text.indexOf(NL, pos);
            if (end < 0) end = text.length;
            let line = text.slice(pos, end);
            pos = end + 1;
            if (line.endsWith(CR)) line = line.slice(0, -1);
            if (!line) continue;
            if (line.indexOf('"') >= 0) {
              // A quoted CSV field may span physical lines.
              while ((line.match(/"/g) || []).length % 2) {
                if (pos >= text.length) throw new Error("Unterminated quoted field in stop_times.txt");
                end = text.indexOf(NL, pos);
                if (end < 0) end = text.length;
                line += NL + text.slice(pos, end);
                pos = end + 1;
              }
              const parsed = csvParse(headerLine + NL + line)[0];
              if (parsed && want.has(parsed.stop_id)) rows.push(parsed);
              continue;
            }
            const cells = line.split(",");
            if (!want.has(cells[stopCol])) continue;
            rows.push(Object.fromEntries(header.map((h, i) => [h, cells[i] || ""])));
          }
          return rows;
        }`;
    }

    function gtfsWorkerTask(message) {
      return new Promise((resolve, reject) => {
        const src = csvParse.toString() + "\n" + readZipEntries.toString() + "\n" + readUnpackedEntries.toString() + "\n" + stopTimesFilterSource() + `
          self.onmessage = async e => {
            try {
              const { kind, buffer, baseUrl, names, stopIds } = e.data;
              const wanted = kind === "tables" ? names : ["stop_times.txt"];
              const files = baseUrl ? await readUnpackedEntries(baseUrl, wanted) : await readZipEntries(buffer, wanted);
              let out;
              if (kind === "tables") {
                out = {};
                for (const k of Object.keys(files)) out[k] = csvParse(files[k]);
              } else {
                if (!files["stop_times.txt"]) throw new Error("GTFS feed missing stop_times.txt");
                out = filterStopTimes(files["stop_times.txt"], stopIds);
              }
              self.postMessage({ ok: true, out });
            } catch (err) { self.postMessage({ ok: false, error: String(err && err.message || err) }); }
          };`;
        const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
        const w = new Worker(url);
        const done = fn => v => { URL.revokeObjectURL(url); w.terminate(); fn(v); };
        w.onmessage = e => (e.data.ok ? done(resolve)(e.data.out) : done(reject)(new Error(e.data.error)));
        w.onerror = e => done(reject)(new Error((e && e.message) || "Worker failed"));
        w.postMessage(message, message.buffer ? [message.buffer] : []);
      });
    }

    async function ingestGtfs(feed, source, requestId = ++gtfsLoadSeq) {
      if (requestId !== gtfsLoadSeq) return;
      const tables = ["stops.txt", "routes.txt", "trips.txt", "calendar.txt", "calendar_dates.txt", "feed_info.txt"];
      setStatus("Reading timetable data...");
      let parsed;
      try {
        parsed = await gtfsWorkerTask({ kind: "tables", ...gtfsWorkerFeed(feed), names: tables });
      } catch (err) {
        console.warn("[gtfs] worker parse failed, parsing on main thread:", err && err.message || err);
        const files = await readGtfsEntries(feed, tables);
        parsed = {};
        for (const name of Object.keys(files)) parsed[name] = csvParse(files[name]);
      }
      if (requestId !== gtfsLoadSeq) return;
      for (const name of ["stops.txt", "routes.txt", "trips.txt"]) {
        if (!parsed[name]) throw new Error("GTFS feed missing " + name);
      }
      state.gtfs = {
        source,
        feed, // kept so buildBundle can filter stop_times on demand
        feedInfo: parsed["feed_info.txt"] || [],
        stops: parsed["stops.txt"],
        routes: parsed["routes.txt"],
        trips: parsed["trips.txt"],
        calendars: parsed["calendar.txt"] || [],
        calendarDates: parsed["calendar_dates.txt"] || []
      };
      setStatus("Loaded " + state.gtfs.stops.length.toLocaleString() + " stops from GTFS.");
    }

    async function scanStopTimes(feed, stopIds) {
      try {
        return await gtfsWorkerTask({ kind: "stopTimes", ...gtfsWorkerFeed(feed), stopIds: Array.from(stopIds) });
      } catch (err) {
        console.warn("[gtfs] worker stop_times filter failed, falling back to main thread:", err && err.message || err);
        const files = await readGtfsEntries(feed, ["stop_times.txt"]);
        if (!files["stop_times.txt"]) throw new Error("GTFS feed missing stop_times.txt");
        return csvParse(files["stop_times.txt"]).filter(st => stopIds.has(st.stop_id));
      }
    }
    // Rows are cached per stop on the loaded feed, so the setup screen's route pills and
    // background rebuilds only scan stop_times.txt for stops they haven't seen yet.
    async function selectedStopTimesFor(stopIds) {
      const cache = state.gtfs.stopTimesCache ||= new Map(); // stopId -> Promise<rows>
      const missing = Array.from(stopIds).filter(id => !cache.has(id));
      if (missing.length) {
        const batch = scanStopTimes(state.gtfs.feed, new Set(missing));
        for (const id of missing) cache.set(id, batch.then(rows => rows.filter(st => st.stop_id === id)));
        batch.catch(() => missing.forEach(id => cache.delete(id)));
      }
      return (await Promise.all(Array.from(stopIds).map(id => cache.get(id)))).flat();
    }

    async function fetchGtfs(options = {}) {
      if (state.gtfsLoading) return false;
      const requestId = ++gtfsLoadSeq;
      const candidates = options.candidates || gtfsFetchCandidates();
      const errors = [];
      state.gtfsLoading = true;
      if (state.config.mode === "setup") renderSetup();
      try {
        if (!options.quiet) setStatus("Fetching GTFS...");
        for (const candidate of candidates) {
          try {
            if (isUnpackedGtfsUrl(candidate)) {
              await ingestGtfs({ baseUrl: new URL(candidate, location.href).href }, candidate, requestId);
            } else {
              if (!("DecompressionStream" in globalThis)) throw new Error("no unzip support in this browser");
              const res = await fetch(candidate);
              if (!res.ok) throw new Error("Fetch failed: " + res.status);
              await ingestGtfs({ buffer: await res.arrayBuffer() }, candidate, requestId);
            }
            if (requestId !== gtfsLoadSeq) return false;
            // Don't pin the unpacked fallback, so a browser that gains unzip support goes back to the zip.
            if (candidate !== state.config.gtfsUrl && candidate !== DEFAULT_GTFS_UNPACKED_URL) saveConfig({ gtfsUrl: candidate });
            return true;
          } catch (err) {
            if (requestId !== gtfsLoadSeq) return false;
            errors.push(candidate + " (" + (err && err.message || err) + ")");
          }
        }
        throw new Error(errors.join("; "));
      } catch (err) {
        if (!options.quiet) setStatus(friendlyError(err, "GTFS fetch"), true);
        return false;
      } finally {
        if (requestId === gtfsLoadSeq) {
          state.gtfsLoading = false;
          if (state.config.mode === "setup") renderSetup();
        }
      }
    }

    async function uploadGtfs(file) {
      if (!file) return;
      const requestId = ++gtfsLoadSeq;
      state.gtfsLoading = true;
      try {
        setStatus("Reading GTFS zip...");
        await ingestGtfs({ buffer: await file.arrayBuffer() }, file.name, requestId);
      } catch (err) { if (requestId === gtfsLoadSeq) setStatus(friendlyError(err, "GTFS upload"), true); }
      finally {
        if (requestId === gtfsLoadSeq) {
          state.gtfsLoading = false;
          if (state.config.mode === "setup") renderSetup();
        }
      }
    }

    function cleanColor(v) {
      const color = String(v || "").replace(/^#/, "").trim().toUpperCase();
      return /^[0-9A-F]{6}$/.test(color) ? color : "";
    }

    function parseRouteColors(text) {
      const colors = new Map();
      for (const rawLine of String(text || "").split(/\r?\n/)) {
        const line = rawLine.trim();
        if (!line || line.startsWith("#")) continue;
        const match = line.match(/^([^:]+):\s*(#[0-9a-f]{6})\s*\/\s*(#[0-9a-f]{6})\s*$/i);
        if (!match) continue;
        const route = match[1].trim();
        colors.set(normLabel(route), { route, background: match[2].toUpperCase(), text: match[3].toUpperCase() });
      }
      return colors;
    }

    // open: false builds in the background (setup preview) without leaving setup.
    async function buildBundle({ open = true } = {}) {
      if (!state.gtfs) { setStatus("Load GTFS data first.", true); return; }
      const buildId = ++bundleBuildSeq;
      const gtfs = state.gtfs;
      // AT rotates the hash suffix of stop ids ("3955-edf582eb") with GTFS releases.
      // If a configured id no longer exists, re-resolve it by its stop code prefix.
      const gtfsStopIds = new Set(state.gtfs.stops.map(s => s.stop_id));
      const resolveStop = id => {
        if (gtfsStopIds.has(id)) return id;
        const code = id.split("-")[0];
        const match = state.gtfs.stops.find(s => s.stop_code === code || s.stop_id.split("-")[0] === code);
        return match ? match.stop_id : id;
      };
      const configuredStops = splitList(state.config.stopIds);
      const resolved = configuredStops.map(resolveStop);
      const resolvedText = resolved.join(", ");
      if (resolvedText !== splitList(state.config.stopIds).join(", ")) saveConfig({ stopIds: resolvedText });
      if (state.config.dualStopMode) {
        const leftIndex = configuredStops.indexOf(state.config.dualStopLeftId);
        const rightIndex = configuredStops.indexOf(state.config.dualStopRightId);
        saveConfig({
          dualStopLeftId: leftIndex >= 0 ? resolved[leftIndex] : resolved[0] || "",
          dualStopRightId: rightIndex >= 0 ? resolved[rightIndex] : resolved.find(id => id !== resolved[0]) || ""
        });
      }
      if (fourWayEnabled()) {
        const platforms = trainPlatformIds().map(resolveStop);
        if (!platforms.every(id => id && gtfsStopIds.has(id))) { setStatus("Choose a valid train platform for each side.", true); return; }
        saveConfig({ trainLeftStopId: platforms[0], trainRightStopId: platforms[1] });
      }
      const stopIds = new Set([...resolved, ...(fourWayEnabled() ? trainPlatformIds() : [])]);
      const trainStops = new Set(fourWayEnabled() ? trainPlatformIds() : []);
      if (!stopIds.size) { setStatus("Add at least one stop.", true); return; }
      if (open) setStatus("Building board...");
      const buildConfig = JSON.stringify(state.config);
      const stillCurrent = () => buildId === bundleBuildSeq && state.gtfs === gtfs && JSON.stringify(state.config) === buildConfig;
      let candidateStopTimes;
      try { candidateStopTimes = await selectedStopTimesFor(stopIds); }
      catch (err) { if (stillCurrent()) setStatus(friendlyError(err, "Board build"), true); return; }
      if (!stillCurrent()) return;
      const routeAllow = new Set(splitList(state.config.routeAllowlist).map(normLabel));
      const routesById = new Map(state.gtfs.routes.map(r => [r.route_id, r]));
      const tripsById = new Map(state.gtfs.trips.map(t => [t.trip_id, t]));
      const stopsById = new Map(state.gtfs.stops.map(s => [s.stop_id, s]));
      const calendarsByService = new Map(state.gtfs.calendars.map(c => [c.service_id, c]));
      const selectedStopTimes = [];
      const tripIds = new Set(), routeIds = new Set(), serviceIds = new Set();
      for (const st of candidateStopTimes) {
        if (!stopIds.has(st.stop_id) || String(st.pickup_type) === "1") continue;
        if (!Number.isFinite(gtfsEpoch("20260101", st.departure_time || st.arrival_time, state.config.timezone))) continue;
        const trip = tripsById.get(st.trip_id);
        const route = trip && routesById.get(trip.route_id);
        if (!trip || !route) continue;
        const labels = [route.route_short_name, route.route_long_name, route.route_id].filter(Boolean);
        if (trainStops.has(st.stop_id)) {
          if (Number(route.route_type) !== 2) continue;
        } else if (routeAllow.size && !labels.some(label => routeAllow.has(normLabel(label)))) continue;
        selectedStopTimes.push(st);
        tripIds.add(st.trip_id); routeIds.add(trip.route_id); serviceIds.add(trip.service_id);
      }
      if (!selectedStopTimes.length) {
        setStatus("No departures matched these stop IDs and route filters. Check the stop IDs, route labels, or leave the route filter blank.", true);
        return;
      }
      if (fourWayEnabled()) {
        for (const [index, id] of trainPlatformIds().entries()) {
          const filters = index === 0 ? state.config.trainLeftRoutes : state.config.trainRightRoutes;
          const matches = selectedStopTimes.some(st => {
            const route = routesById.get(tripsById.get(st.trip_id).route_id);
            return st.stop_id === id && trainRoutesMatch({ shortName: route.route_short_name, longName: route.route_long_name, routeId: route.route_id }, filters);
          });
          if (!matches) { setStatus("No train services match the " + (index === 0 ? "left" : "right") + " platform and train lines. Check the train lines for that side.", true); return; }
        }
      }
      const bundle = {
        schemaVersion: 1,
        generatedAt: new Date().toISOString(),
        source: state.gtfs.source,
        config: Object.assign({}, state.config, { mode: "board" }),
        feedInfo: state.gtfs.feedInfo[0] || {},
        stops: {}, routes: {}, trips: {},
        calendars: {}, calendarDates: {}, stopTimesByStop: {}
      };
      for (const stopId of stopIds) {
        const s = stopsById.get(stopId);
        if (s) bundle.stops[stopId] = { stopId, name: s.stop_name || stopId, platformCode: s.platform_code || "", lat: +s.stop_lat, lon: +s.stop_lon };
      }
      for (const routeId of routeIds) {
        const r = routesById.get(routeId);
        bundle.routes[routeId] = { routeId, type: Number(r.route_type), shortName: r.route_short_name || r.route_long_name || routeId, longName: r.route_long_name || "", color: cleanColor(r.route_color), textColor: cleanColor(r.route_text_color) };
      }
      for (const tripId of tripIds) {
        const t = tripsById.get(tripId);
        bundle.trips[tripId] = { tripId, routeId: t.route_id, serviceId: t.service_id, headsign: t.trip_headsign || t.trip_short_name || tripId, directionId: t.direction_id || "" };
      }
      for (const serviceId of serviceIds) {
        const c = calendarsByService.get(serviceId);
        if (c) bundle.calendars[serviceId] = c;
        bundle.calendarDates[serviceId] = state.gtfs.calendarDates.filter(d => d.service_id === serviceId);
      }
      for (const st of selectedStopTimes) {
        const trip = tripsById.get(st.trip_id);
        (bundle.stopTimesByStop[st.stop_id] ||= []).push({
          tripId: st.trip_id, routeId: trip.route_id, serviceId: trip.service_id,
          stopId: st.stop_id, stopSequence: +st.stop_sequence || 0,
          arrivalTime: st.arrival_time, departureTime: st.departure_time || st.arrival_time,
          headsign: st.stop_headsign || trip.trip_headsign || ""
        });
      }
      for (const stopId of Object.keys(bundle.stopTimesByStop)) {
        bundle.stopTimesByStop[stopId].sort((a, b) => a.departureTime.localeCompare(b.departureTime) || a.stopSequence - b.stopSequence);
      }
      state.bundle = bundle;
      saveJson("bundle", bundle);
      if (!open) { saveConfig(); state.status = ""; state.error = ""; return; }
      saveConfig({ mode: "board" });
      setStatus("Built board: " + selectedStopTimes.length.toLocaleString() + " departures.");
    }

    // Realtime
    function departureStopCodes() {
      // AT stop codes (the number on the sign, used by the departures API) are the
      // leading segment of GTFS stop ids like "3955-edf582eb".
      const ids = boardStopIds();
      return Array.from(new Set(ids.filter(Boolean).map(id => id.split("-")[0])));
    }

    // Per-stop predictions from AT's departures API. Coverage is intentionally treated as
    // partial: unmonitored and omitted trips remain scheduled on the board.
    // "1279-02401-33600-2-1824e17a" -> "1279-02401-33600-2" (drops AT's version hash).
    function tripIdBase(id) { return String(id || "").replace(/-[0-9a-f]{8}$/i, ""); }

    async function fetchMovements(codes, key) {
      const base = String(state.config.departuresUrl || "").replace(/\/+$/, "");
      const movements = {};
      const notices = [];
      const results = await Promise.all(codes.map(async code => {
        try {
          const res = await fetch(base + "/" + encodeURIComponent(code) + "?scope=tripsData", {
            signal: AbortSignal.timeout(20000),
            headers: { "Ocp-Apim-Subscription-Key": key, "Cache-Control": "no-cache" }
          });
          const payload = await res.json();
          if (!res.ok || payload.message) throw new Error((payload.message || "fetch failed") + " (" + res.status + ")");
          const feed = payload.response || payload;
          for (const ext of gtfsRtArray(feed.extensions)) {
            if (ext && ext.text) notices.push({ code, priority: String(ext.priority || "low").toLowerCase(), text: String(ext.text).trim() });
          }
          for (const m of gtfsRtArray(feed.movements)) {
            if (!m || !m.trip_id) continue;
            // The AT website prefers the arrival prediction for its "Due" display — match it.
            const expected = Date.parse(m.expectedArrivalTime || m.expectedDepartureTime || "");
            const scheduledMs = Date.parse(m.scheduledArrivalTime || m.scheduledDepartureTime || "");
            const entry = {
              expected: Number.isFinite(expected) ? expected : undefined,
              scheduled: Number.isFinite(scheduledMs) ? scheduledMs : undefined,
              cancelled: /cancel/i.test(String(m.arrivalStatus || "")) || /cancel/i.test(String(m.departureStatus || "")),
              monitored: Boolean(m.monitored)
            };
            movements[m.trip_id + ":" + code] = entry;
            // AT re-versions trip ids (the trailing hash) when timetables are republished, so a
            // slightly stale GTFS bundle would miss every prediction. Also index without the hash.
            movements["~" + tripIdBase(m.trip_id) + ":" + code] = entry;
          }
          return { code, ok: true };
        } catch (err) {
          return { code, ok: false, error: code + " (" + (err && err.message || err) + ")" };
        }
      }));
      const errors = results.filter(r => !r.ok).map(r => r.error);
      const succeeded = results.length - errors.length;
      if (!succeeded) throw new Error("Departures API: " + errors.join("; "));
      return { movements, notices, requested: codes.length, succeeded, errors };
    }

    async function refreshRealtime() {
      const requestId = ++realtimeRequestSeq;
      const cfg = state.config;
      const key = subscriptionKey(cfg);
      const depKey = String(cfg.departuresKey || "").trim() || DEPARTURES_KEY || key;
      // Did the feeds that authenticate with the selected subscription key work? null = not
      // tested this run. Drives the setup "Test" verdict, so it validates that key
      // specifically (the departures API uses a different embedded key and always works).
      state.subKeyOk = null;
      state.refreshing = true;
      const userFeeds = key ? [
        { kind: "tripUpdates", label: "trip updates", url: cfg.realtimeUrl },
        { kind: "alerts", label: "service alerts", url: cfg.alertsUrl },
        { kind: "vehicles", label: "vehicle positions", url: cfg.vehiclesUrl }
      ].filter(feed => feed.url) : [];
      const depCodes = cfg.departuresUrl && depKey ? departureStopCodes() : [];
      if (!userFeeds.length && !depCodes.length) {
        state.realtimeStatus = "No API key";
        state.status = "Configure the departures API or an AT subscription key to fetch live data.";
        state.error = state.status;
        state.refreshing = false;
        state.refreshFailed = true;
        return;
      }
      try {
        const headers = { "Cache-Control": "no-cache", "Ocp-Apim-Subscription-Key": key };
        const tasks = [
          {
            kind: "departures",
            label: "stop predictions",
            run: depCodes.length
              ? fetchMovements(depCodes, depKey)
              : Promise.resolve({ movements: {}, requested: 0, succeeded: 0, errors: [] })
          },
          ...userFeeds.map(feed => ({
            kind: feed.kind,
            label: feed.label,
            run: (async () => {
              const res = await fetch(feed.url, { method: "GET", headers, signal: AbortSignal.timeout(20000) });
              let payload;
              try { payload = await res.json(); }
              catch { throw new Error("Realtime response from " + feed.url + " is not JSON."); }
              if (!res.ok || payload.message) {
                throw new Error((payload.message || "Realtime fetch failed") + " (" + res.status + ")");
              }
              return normalizeRealtime(payload, feed.url);
            })()
          }))
        ];
        const settled = await Promise.allSettled(tasks.map(task => task.run));
        if (requestId !== realtimeRequestSeq) return;
        const failures = settled
          .map((result, index) => result.status === "rejected" ? new Error(tasks[index].label + ": " + (result.reason && result.reason.message || result.reason)) : null)
          .filter(Boolean);
        if (userFeeds.length) state.subKeyOk = settled.slice(1).some(s => s.status === "fulfilled");
        const configuredResults = depCodes.length ? settled : settled.slice(1);
        if (configuredResults.every(result => result.status === "rejected")) throw failures[0];
        const departuresResult = settled[0].status === "fulfilled"
          ? settled[0].value
          : { movements: {}, requested: depCodes.length, succeeded: 0, errors: [failures[0] && failures[0].message] };
        const movements = departuresResult.movements || {};
        const feeds = settled.slice(1).filter(s => s.status === "fulfilled").map(s => s.value);
        const feedHealth = Object.fromEntries(tasks.map((task, index) => [task.kind, {
          configured: task.kind === "departures" ? Boolean(depCodes.length) : true,
          ok: settled[index].status === "fulfilled",
          error: settled[index].status === "rejected" ? String(settled[index].reason && settled[index].reason.message || settled[index].reason) : ""
        }]));
        feedHealth.departures.requested = departuresResult.requested || 0;
        feedHealth.departures.succeeded = departuresResult.succeeded || 0;
        feedHealth.departures.errors = departuresResult.errors || [];
        state.realtime = feeds.reduce((a, f) => ({
          fetchedAt: Math.max(a.fetchedAt || 0, f.fetchedAt || 0),
          feedTimestamp: Math.max(a.feedTimestamp || 0, f.feedTimestamp || 0),
          sourceUrl: a.sourceUrl || f.sourceUrl,
          trips: Object.assign(a.trips || {}, f.trips || {}),
          vehicles: Object.assign(a.vehicles || {}, f.vehicles || {}),
          alerts: (a.alerts || []).concat(f.alerts || []),
          movements: a.movements,
          notices: a.notices,
          feedHealth: a.feedHealth
        }), { fetchedAt: Date.now(), trips: {}, vehicles: {}, alerts: [], movements, notices: departuresResult.notices || [], feedHealth });
        const parts = [];
        const liveCount = Object.values(movements).filter(m => m.expected).length;
        if (depCodes.length) parts.push(liveCount.toLocaleString() + " stop predictions from " + departuresResult.succeeded + "/" + departuresResult.requested + " stops");
        if (feedHealth.tripUpdates && feedHealth.tripUpdates.ok) parts.push(Object.keys(state.realtime.trips).length.toLocaleString() + " trip updates");
        if (feedHealth.vehicles && feedHealth.vehicles.ok) parts.push(Object.keys(state.realtime.vehicles).length.toLocaleString() + " vehicle reports");
        if (feedHealth.alerts && feedHealth.alerts.ok) parts.push(state.realtime.alerts.length.toLocaleString() + " alerts");
        state.realtimeStatus = parts.join(" · ") || "No data";
        state.status = "Realtime loaded: " + state.realtimeStatus + ".";
        state.refreshFailed = false;
        saveJson("realtime", state.realtime);
        const partialStopError = departuresResult.errors && departuresResult.errors[0];
        state.error = failures.length
          ? friendlyError(failures[0], "Partial realtime fetch")
          : partialStopError ? "Some stops could not fetch predictions: " + partialStopError : "";
      } catch (err) {
        if (requestId !== realtimeRequestSeq) return;
        console.warn("[realtime] fetch failed:", err && err.message || err);
        state.status = friendlyError(err, "Realtime fetch");
        state.error = state.status;
        state.realtimeStatus = "Fetch failed";
        state.refreshFailed = true;
      } finally {
        if (requestId === realtimeRequestSeq) state.refreshing = false;
      }
    }

    function normalizeRealtime(payload, sourceUrl) {
      const feed = payload.response || payload;
      const entities = gtfsRtArray(feed.entity || payload.entity);
      const rt = { fetchedAt: Date.now(), sourceUrl, feedTimestamp: secToMs(feed.header && feed.header.timestamp), trips: {}, vehicles: {}, alerts: [] };
      for (const e of entities) {
